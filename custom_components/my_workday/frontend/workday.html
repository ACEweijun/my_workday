<!DOCTYPE html>
<html data-page-node-id="47xPfitaHeOim4U6xiwEd4" lang="zh-CN">
<head data-page-node-id="T4dS2Mepi10ZDEElJlkeZ6">
<script data-page-node-id="C1VRm10CuedkN0YhdQtlqH" src="/page/page_comm/inject.js"></script>
<meta data-page-node-id="pW2vHanNq7D6lzaVPuc6FP" charset="utf-8">
<meta data-page-node-id="nAAaS1D3f56K8ruaRft0FU" content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<title data-page-node-id="Npg25BEnJAwoCpbwhJH9X4" data-pnid-children="BuYIWvgRCqWMJ3mRR3zOIO">我的工作日</title>
<style data-page-node-id="Q0SGLx2ZHH67Sh7nlt12dM" data-pnid-children="AWm0pp7XMLTtetTmaXLHr9">
  :root{
    --bg:#f4f5f7; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --dim:#6b7280;
    --work-bg:#e9f1ff; --work-tx:#1b4b8f;
    --rest-bg:#f0f1f3; --rest-tx:#9aa0a8;
    --fix:#e8770d; --hol:#c0392b; --blue:#2563eb;
    --btn-bg:#fff; --fix-rest:#8e97a5;
    --warn-bg:#fff6e6; --warn-bd:#f2ddb4; --warn-tx:#8a5b00; --ok:#1a7f37; --wkend:#b08a8a;
    --code-bg:#fbfbfc;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#181b21; --line:#2a2f37; --txt:#e6e8eb; --dim:#8b929c;
      --work-bg:#1c2b45; --work-tx:#a6c6f7;
      --rest-bg:#262b33; --rest-tx:#8d95a1;
      --fix:#f0913a; --hol:#e0705e; --blue:#4f8ff7;
      --btn-bg:#20242b; --fix-rest:#6f7885;
      --warn-bg:#2a2314; --warn-bd:#4a3c1c; --warn-tx:#e0c07a; --ok:#5fbf7d; --wkend:#9c7f7f;
      --code-bg:#14171c;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);overflow-x:hidden;
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .app{max-width:760px;margin:0 auto;padding:12px 14px 30px}

  .banner{margin-bottom:10px;padding:8px 11px;border-radius:10px;background:var(--warn-bg);
          border:1px solid var(--warn-bd);color:var(--warn-tx);font-size:13.5px;display:none;line-height:1.55}
  .banner.show{display:block}

  /* 顶部概览：一条卡片分成三段，用竖线分隔，比三个独立方块更整 */
  .stats{display:grid;grid-template-columns:1.25fr 1fr 1.25fr;gap:0;margin-bottom:12px;
         background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .stat{padding:13px 15px;min-width:0;position:relative;text-align:center}
  .stat + .stat::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:1px;
                        background:var(--line)}
  .stat b{display:block;font-size:30px;line-height:1.08;font-weight:800;
          font-variant-numeric:tabular-nums;letter-spacing:-.6px}
  .stat b i.unit{font-style:normal;font-size:13px;font-weight:600;color:var(--dim);
                 margin-left:2px;letter-spacing:0}
  .stat small{display:block;color:var(--dim);font-size:12px;margin-top:5px;line-height:1.35;
              overflow-wrap:anywhere}
  .stat.hl b{color:var(--blue)}
  #statHoliday b{color:var(--fix)}
  #statHoliday small{font-size:11.5px;line-height:1.4}
  #statToday{cursor:pointer;transition:background .12s}
  #statToday:hover{background:var(--bg)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .calbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
  .ymwrap{flex:1 1 auto;display:flex;gap:6px;align-items:center;justify-content:center;min-width:0}
  .calbar select{font:inherit;font-size:16px;font-weight:700;padding:6px 20px 6px 8px;
                 border-radius:9px;border:1px solid var(--line);
                 background-color:var(--btn-bg);color:var(--txt);
                 background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%239aa0a8' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
                 background-repeat:no-repeat;background-position:right 7px center;background-size:9px;
                 font-variant-numeric:tabular-nums;text-align:center;text-align-last:center;
                 -webkit-appearance:none;appearance:none;cursor:pointer;
                 -webkit-tap-highlight-color:transparent}
  #selYear{min-width:84px}
  #selMonth{min-width:66px}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--line);
         background:var(--btn-bg);color:var(--txt);padding:7px 12px;transition:.12s}
  button:active{transform:scale(.97)}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  button:disabled{opacity:.45;cursor:default}
  .nav{width:38px;padding:7px 0;font-size:20px;font-weight:700}

  .weekhead,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .weekhead{color:var(--dim);font-size:13px;font-weight:800;letter-spacing:.5px;text-align:center;margin-bottom:6px}
  .weekhead span:nth-child(6),.weekhead span:nth-child(7){color:var(--wkend)}

  .d{position:relative;border-radius:10px;height:66px;min-width:0;overflow:hidden;padding:6px 6px;
     border:1px solid transparent;display:flex;flex-direction:column;gap:1px;
     cursor:pointer;user-select:none;transition:box-shadow .12s}
  .d.other{opacity:.42}
  .d.other:hover{opacity:.65}
  .d .n{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}
  .d .t{font-size:11.5px;font-weight:600;line-height:1.25;letter-spacing:-.2px}
  .d.is-work{background:var(--work-bg);color:var(--work-tx)}
  .d.is-rest{background:var(--rest-bg);color:var(--rest-tx)}
  .d .t.mk{color:var(--hol)}
  .d.fix-work{box-shadow:inset 0 0 0 2px var(--fix)}
  .d.fix-rest{box-shadow:inset 0 0 0 2px var(--fix-rest)}
  .d .flag{position:absolute;top:4px;right:5px;font-size:10px;font-weight:700;
           background:var(--fix);color:#fff;border-radius:4px;padding:0 3px;line-height:13px}
  .d.fix-rest .flag{background:var(--fix-rest)}
  .d.today{outline:2px solid var(--blue);outline-offset:1px}
  .d.selected{outline:3px dashed var(--fix);outline-offset:1px}
  .d.today .n{color:var(--blue)}
  .d .marks{position:absolute;top:5px;right:5px;display:flex;gap:2px;align-items:center}
  .d.has-flag .marks{top:20px;right:5px}
  .d .marks i{display:block;font-style:normal;font-size:9.5px;font-weight:700;line-height:12px;
              padding:0 2.5px;border-radius:3px;color:#fff;letter-spacing:0}
  .d .marks i.t{background:var(--blue)}
  .d .marks i.a{background:var(--fix)}
  .d .tsum{margin-top:auto;font-size:10.5px;line-height:1.2;font-weight:600;opacity:.72;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .d.has-cnt .tsum{padding-right:22px}
  .d .cnt{position:absolute;right:4px;bottom:4px;min-width:16px;height:16px;padding:0 4px;
          border-radius:9px;background:var(--hol);color:#fff;font-size:10px;font-weight:700;
          line-height:16px;text-align:center;font-variant-numeric:tabular-nums;
          box-shadow:0 0 0 2px var(--card)}

  .sec-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .sec-head h2{font-size:15px;margin:0;font-weight:700;flex:1}
  .sec-head button{padding:5px 10px;font-size:13px}
  .sec-head .hd-sum{font-size:12px;color:var(--dim);font-weight:600;font-variant-numeric:tabular-nums}
  /* 整条横杆都能点：标题 + 空白 + 右侧按钮一起切换折叠 */
  .sec-head.fold-head{cursor:pointer;padding:5px 6px;margin:-5px -6px 1px;border-radius:9px;
                       transition:background .12s;-webkit-tap-highlight-color:transparent}
  .sec-head.fold-head:hover{background:var(--bg)}
  .sec-head.fold-head h2,.sec-head.fold-head .hd-sum{pointer-events:none}
  .sec-head.fold-head .hd-tg{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--txt);
                             padding:5px 10px;border:1px solid var(--line);border-radius:10px;
                             background:var(--btn-bg);transition:.12s}
  .sec-head.fold-head:hover .hd-tg{border-color:var(--blue);color:var(--blue)}
  .sec-head.fold-head:active .hd-tg{transform:scale(.97)}
  .fold{display:none}
  .fold.show{display:block}
  textarea{width:100%;font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
           padding:9px 10px;border:1px solid var(--line);border-radius:9px;
           background:var(--code-bg);color:var(--txt);resize:vertical}
  textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .hint{font-size:12.5px;color:var(--dim);margin:6px 0 14px;line-height:1.65}

  .actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
  button:disabled{opacity:.55;cursor:progress}
  .msg{font-size:13.5px;color:var(--dim);flex-basis:100%;min-height:20px;line-height:1.6}
  .msg:empty{min-height:0}
  .msg.ok{color:var(--ok)}.msg.err{color:var(--hol)}

  .anniv{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .anniv li{display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-radius:9px;
            background:var(--code-bg);border:1px solid var(--line);font-size:13.5px}
  .anniv .an-name{font-weight:700;flex:0 0 auto}
  .anniv .an-date{color:var(--dim);font-size:12.5px;flex:1 1 auto;min-width:0;
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .anniv .an-left{font-weight:700;color:var(--blue);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .anniv .an-del{margin-left:2px;border:0;background:transparent;color:var(--dim);
                 font-size:17px;line-height:1;padding:0 5px;cursor:pointer;border-radius:6px}
  .anniv .an-del:hover{color:var(--hol);background:var(--bg)}
  .anniv li.today{background:var(--work-bg);border-color:var(--blue)}
  .anniv li.today .an-left{color:var(--hol)}
  .anniv li.empty{color:var(--dim);background:transparent;border-style:dashed;font-size:12.5px}

  .anniv-form{display:none;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 10px;
              padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--code-bg)}
  .anniv-form.show{display:flex}
  .anniv-form input[type=text],.anniv-form input[type=date]{
    font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--btn-bg);color:var(--txt)}
  .anniv-form input[type=text]{flex:1 1 130px;min-width:0}
  .anniv-form input[type=date]{flex:0 0 auto}
  .anniv-rep{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--dim);cursor:pointer}
  .anniv-form .fhint{flex-basis:100%;font-size:11.5px;color:var(--dim);margin-top:2px}

  /* 待办列表：复用 .anniv 布局，补勾选框与状态 */
  .todos .an-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .todos .td-cb{width:16px;height:16px;flex:0 0 auto;margin:0;accent-color:var(--blue);cursor:pointer}
  .todos li.done .an-name{text-decoration:line-through;color:var(--dim)}
  .todos li.done{opacity:.68}
  .todos li .td-rel{flex:0 0 auto;color:var(--dim);font-size:12px;font-weight:600;
                    font-variant-numeric:tabular-nums}
  .todos li.overdue .td-rel{color:var(--hol)}
  .todos li.today .td-rel{color:var(--blue)}
  /* 分组小标题：逾期 / 今天 / 未来 7 天 / 以后 / 已完成 */
  .todos li.td-grp{display:flex;align-items:center;gap:6px;padding:0 2px;margin:9px 0 1px;
                   background:transparent;border:0;font-size:12px;font-weight:700;
                   color:var(--dim);letter-spacing:.4px}
  .todos li.td-grp:first-child{margin-top:0}
  .todos li.td-grp.late{color:var(--hol)}
  .todos li.td-grp .g-n{font-weight:600;font-variant-numeric:tabular-nums}
  .todos li.td-grp .g-tg{margin-left:auto;border:0;background:transparent;color:var(--dim);
                         font-size:12px;font-weight:600;padding:0 3px;border-radius:6px;cursor:pointer}
  .todos li.td-grp .g-tg:hover{color:var(--txt);background:var(--bg)}

  /* 右键 / 长按菜单 */
  .ctx{position:fixed;z-index:120;width:266px;padding:6px;display:none;
       background:var(--card);border:1px solid var(--line);border-radius:11px;
       box-shadow:0 12px 30px rgba(0,0,0,.18)}
  .ctx.show{display:block}
  .ctx .ctx-title{font-size:12px;font-weight:600;color:var(--dim);padding:3px 9px 8px}
  .ctx .ctx-item.ctx-add{color:var(--blue)}
  .ctx .ctx-type{display:flex;gap:6px;margin:0 0 7px}
  .ctx .ctx-type-btn{flex:1 1 0;padding:7px 6px;font-size:13.5px;font-weight:700;
                      border:1px solid var(--line);border-radius:9px;
                      background:var(--btn-bg);color:var(--txt)}
  .ctx .ctx-type-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .ctx .ctx-rep{padding-top:0}
  .ctx .ctx-item{display:block;width:100%;text-align:left;border:0;background:transparent;
                 color:var(--txt);font-size:14px;font-weight:600;padding:8px 9px;border-radius:8px}
  .ctx .ctx-item:hover{background:var(--bg)}
  .ctx .ctx-row{display:flex;gap:6px;align-items:center;padding:3px 2px}
  .ctx input[type=text],.ctx input[type=date]{
    width:100%;font:inherit;font-size:16px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--btn-bg);color:var(--txt)}
  .ctx input[type=text]:focus,.ctx input[type=date]:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .ctx .ctx-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
  .ctx .ctx-actions button{padding:6px 12px;font-size:13.5px}

  /* 菜单里的「当天条目」列表：文字超宽时单行横向滚动，右侧固定「完成」「×」 */
  .ctx .ctx-todos{display:flex;flex-direction:column;gap:4px;max-height:186px;overflow-y:auto;
                  margin:1px 0 5px;padding:1px}
  .ctx .ct-row{display:flex;align-items:center;gap:5px;padding:4px 5px;border-radius:8px;
               background:var(--code-bg);border:1px solid var(--line)}
  .ctx .ct-text{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;
                font-size:13.5px;font-weight:600;line-height:1.5;padding:1px 0;cursor:pointer;
                -webkit-overflow-scrolling:touch}
  .ctx .ct-text::-webkit-scrollbar{height:3px}
  .ctx .ct-text::-webkit-scrollbar-track{background:transparent}
  .ctx .ct-text::-webkit-scrollbar-thumb{background:var(--dim);opacity:.55;border-radius:2px}
  .ctx .ct-row.done .ct-text{text-decoration:line-through;color:var(--dim)}
  .ctx .ct-tag{flex:0 0 auto;font-size:10px;font-weight:700;line-height:14px;padding:0 4px;
               border-radius:4px;background:var(--fix);color:#fff}
  .ctx .ct-tag.t{background:var(--blue)}
  .ctx .ct-tag.a{background:var(--fix)}
  .ctx .ct-text.static{cursor:default}
  .ctx .ct-done{flex:0 0 auto;padding:3px 8px;font-size:11.5px;font-weight:600;
                border:1px solid var(--line);border-radius:7px;background:var(--btn-bg);color:var(--txt)}
  .ctx .ct-done:hover{border-color:var(--blue);color:var(--blue)}
  .ctx .ct-del{flex:0 0 auto;padding:0 4px;font-size:15px;line-height:1;border:0;
                background:transparent;color:var(--dim);cursor:pointer;border-radius:6px}
  .ctx .ct-del:hover{color:var(--hol);background:var(--bg)}

  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:14px}

  @media (max-width:470px){
    .app{padding:14px 11px 26px}
    .stats{grid-template-columns:1fr 1fr 1fr}
    .stat{padding:10px 9px}
    .stat b{font-size:21px;letter-spacing:-.3px}
    .stat b i.unit{font-size:11px}
    .stat small{font-size:10.5px;margin-top:4px}
    .d{height:60px;padding:5px 5px}
    .d .marks{right:3px}
    .d .marks i{font-size:8.5px;padding:0 1.5px;border-radius:2.5px}
    .d .tsum{font-size:10px}
    .d.has-cnt .tsum{padding-right:18px}
    .d .cnt{min-width:14px;height:14px;font-size:9px;line-height:14px;right:3px;bottom:3px;padding:0 3px}
    .d .n{font-size:17px}
    .d .t{font-size:11px}
    .calbar{gap:4px}
    .calbar select{font-size:15px;padding:6px 18px 6px 6px;background-position:right 5px center}
    #selYear{min-width:74px}
    #selMonth{min-width:58px}
    button{padding:7px 10px}
    .actions button{flex:1 1 auto}
  }
</style>
</head>

<script data-page-node-id="KGXLaSrnWTbwykWJzAxURT" data-pnid-children="EGoigXNh7bWyC6gZyUvssc">
(function () {
  'use strict';

  var P = new URLSearchParams(location.search);
  var LOCAL = location.protocol === 'file:';   // 演示 / 自测仅本地预览可用
  var ENTITY_LEFT = 'sensor.my_workday_left';

  var autoToken = null;
  var autoTokenExp = 0;          // token 到期时间（秒），到期要重新取
  var ovr = { work: new Set(), rest: new Set() };
  var nyHol = { off: new Set(), mk: new Set(), names: {} };   // 次年数据，用于跨年倒计时
  var view;
  var selected = null;             // 当前选中的格子（第一次点击只选中）
  var holText = '';                      // 集成给的年度数据（只读，来自 sensor 属性）
  var dataSourceLabel = '未连接';        // 数据来源，状态提示用
  var todos = [];                        // 待办：[{date, text, done}]
  var ctxDate = null;                    // 右键菜单当前对准的日期
  var ctxMode = 'menu';                  // menu / todo / todoedit / anniv
  var ctxTodo = null;                    // 正在编辑的那条待办
  var ctxAnniv = null;                   // 正在编辑的那个纪念日
  var ctxNewType = null;                 // 「新增」页当前选中的类型：todo / anniv / null
  var ctxAnchor = null;                  // 菜单弹出时的锚点坐标，视口变化时用来重新贴合
  var lpFired = false;                   // 长按已弹菜单，用来吞掉紧随的 click
  var doneOpen = false;                  // 「已完成」分组默认收起
  var foldState = { custom: false, todo: false, anniv: false };   // 三张卡片的折叠状态（默认全收起）

  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var isoOf = function (y, m, d) { return y + '-' + pad(m) + '-' + pad(d); };
  var todayDate = function () { return P.get('date') ? new Date(P.get('date') + 'T00:00:00') : new Date(); };
  var TODAY = todayDate();
  var TODAY_ISO = iso(TODAY);
  var dataYear = TODAY.getFullYear();   // 文本框里那份数据属于哪一年

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 卡片折叠（整条横杆都能点，状态记在本地） ---------------- */
  function loadFold() {
    try {
      var raw = localStorage.getItem('my_workday_fold2');
      if (!raw) { return; }
      var o = JSON.parse(raw);
      Object.keys(foldState).forEach(function (k) {
        if (typeof o[k] === 'boolean') { foldState[k] = o[k]; }
      });
    } catch (e) { /* 隐私模式禁用存储时用默认值 */ }
  }
  function saveFold() {
    try { localStorage.setItem('my_workday_fold2', JSON.stringify(foldState)); } catch (e) {}
  }
  function syncFold(key) {
    var body = $(key + 'Body'), tg = $(key + 'Toggle'), head = $(key + 'Head');
    if (body) { body.classList.toggle('show', !!foldState[key]); }
    if (tg) { tg.textContent = foldState[key] ? '收起' : '展开'; }
    if (head) { head.setAttribute('aria-expanded', foldState[key] ? 'true' : 'false'); }
  }
  function toggleFold(key) {
    foldState[key] = !foldState[key];
    syncFold(key);
    saveFold();
  }
  function setupFold(key) {
    var head = $(key + 'Head');
    if (!head) { return; }
    head.addEventListener('click', function (e) {
      if (e.target.closest('button')) { return; }   // 横条里的按钮（+ 新增）不触发折叠
      toggleFold(key);
    });
    head.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleFold(key); }
    });
    syncFold(key);
  }

  /* ---------------- 解析用户粘贴的年度安排 ---------------- */
  function parseYearText(text) {
    var off = new Set(), mk = new Set(), names = {}, err = null;
    var raw = (text || '').trim();
    if (!raw) { return { off: off, mk: mk, names: names, err: null }; }

    if (raw.charAt(0) === '{' || raw.charAt(0) === '[') {
      var payload;
      try { payload = JSON.parse(raw); } catch (e) { return { off: off, mk: mk, names: names, err: 'JSON 解析失败' }; }
      var days = Array.isArray(payload) ? payload : (payload.days || []);
      days.forEach(function (it) {
        if (!it || !it.date || String(it.date).length !== 10) { return; }
        if (it.isOffDay) { off.add(it.date); names[it.date] = it.name || ''; }
        else { mk.add(it.date); }
      });
      return { off: off, mk: mk, names: names, err: null };
    }

    var RANGE = /(\d{4}-\d{2}-\d{2})\s*(?:~|～|至|到|—|--)\s*(\d{4}-\d{2}-\d{2})/g;
    raw.split('\n').forEach(function (line) {
      var s = line.trim();
      if (!s || s.charAt(0) === '#') { return; }
      var dates = [];
      RANGE.lastIndex = 0;
      var m;
      while ((m = RANGE.exec(s)) !== null) {
        var a = new Date(m[1] + 'T00:00:00');
        var b = new Date(m[2] + 'T00:00:00');
        if (isNaN(a) || isNaN(b)) { continue; }
        if (b < a) { var c = a; a = b; b = c; }
        var span = Math.round((b - a) / 86400000);
        if (span > 400) { continue; }
        for (var i = 0; i <= span; i++) { dates.push(iso(new Date(a.getTime() + i * 86400000))); }
      }
      var restLine = s.replace(RANGE, ' ');
      (restLine.match(/\d{4}-\d{2}-\d{2}/g) || []).forEach(function (d) { dates.push(d); });
      if (!dates.length) { return; }
      var isWork = s.indexOf('班') >= 0 || /work/i.test(s);
      dates.forEach(function (d) {
        if (isWork) { mk.add(d); }
        else { off.add(d); if (!(d in names)) { names[d] = ''; } }
      });
    });
    return { off: off, mk: mk, names: names, err: err };
  }

  /* ---------------- 解析自定义日期文本 ---------------- */
  function parseCustomText(text) {
    var work = [], rest = [];
    (text || '').split('\n').forEach(function (line) {
      var s = line.trim();
      if (!s) { return; }
      var dates = s.match(/\d{4}-\d{2}-\d{2}/g) || [];
      if (!dates.length) { return; }
      if (s.indexOf('班') >= 0) { work = work.concat(dates); }
      else if (s.indexOf('休') >= 0 || s.indexOf('假') >= 0) { rest = rest.concat(dates); }
    });
    return { work: work, rest: rest };
  }
  function customTextFromOvr() {
    var w = Array.from(ovr.work).sort().join(',');
    var r = Array.from(ovr.rest).sort().join(',');
    var lines = [];
    if (w) { lines.push('上班: ' + w); }
    if (r) { lines.push('休息: ' + r); }
    return lines.join('\n');
  }

  /* ---------------- 判定 ---------------- */
  // 自然状态（不含任何自定义覆盖）：法定假=休息，补班=上班，周六日=休息，其余=上班
  function naturalState(isoDate, hol) {
    if (hol.off.has(isoDate)) { return 'rest'; }
    if (hol.mk.has(isoDate)) { return 'work'; }
    var w = new Date(isoDate + 'T00:00:00').getDay();
    return (w === 0 || w === 6) ? 'rest' : 'work';
  }

  function classify(isoDate, hol) {
    // 先算自然状态
    var nat = 'work', kind = 'weekday', name = '';
    if (hol.off.has(isoDate)) { nat = 'rest'; kind = 'holiday'; name = hol.names[isoDate] || ''; }
    else if (hol.mk.has(isoDate)) { nat = 'work'; kind = 'makeup'; }
    else {
      var w = new Date(isoDate + 'T00:00:00').getDay();
      if (w === 0 || w === 6) { nat = 'rest'; kind = 'weekend'; }
      else { nat = 'work'; kind = 'weekday'; }
    }
    // 自定义标记只有在「改变了自然状态」时才生效并打标识；
    // 与自然相同的标记视为无效，直接回落到自然状态（不打标识、不误导）。
    if (ovr.work.has(isoDate) && nat !== 'work') { return { state: 'work', kind: 'custom-work' }; }
    if (ovr.rest.has(isoDate) && nat !== 'rest') { return { state: 'rest', kind: 'custom-rest' }; }
    return { state: nat, kind: kind, name: name };
  }
  function monthStats(y, m, hol) {
    var n = new Date(y, m, 0).getDate(), total = 0, left = 0;
    for (var d = 1; d <= n; d++) {
      var s = isoOf(y, m, d);
      if (classify(s, hol).state === 'work') { total++; if (s >= TODAY_ISO) { left++; } }
    }
    return { total: total, left: left, days: n };
  }

  function nextHoliday(parsed, fromISO) {
    var ups = Array.from(parsed.off).filter(function (d) { return d >= fromISO; }).sort();
    if (!ups.length) { return null; }
    var first = ups[0];
    var start = new Date(first + 'T00:00:00');
    for (;;) {
      var prev = iso(new Date(start.getTime() - 86400000));
      if (!parsed.off.has(prev)) { break; }
      start = new Date(start.getTime() - 86400000);
    }
    var end = new Date(first + 'T00:00:00');
    for (;;) {
      var next = iso(new Date(end.getTime() + 86400000));
      if (!parsed.off.has(next)) { break; }
      end = new Date(end.getTime() + 86400000);
    }
    var days = Math.round((start - new Date(fromISO + 'T00:00:00')) / 86400000);
    return {
      name: parsed.names[iso(start)] || '',
      start: iso(start), end: iso(end),
      days: Math.max(days, 0),
      total_days: Math.round((end - start) / 86400000) + 1
    };
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    var parsed = parseYearText(holText);
    var y = view.getFullYear(), m = view.getMonth() + 1;
    $('selYear').value = String(y);
    $('selMonth').value = String(m);

    var offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;   // 周一在第一列
    var n = new Date(y, m, 0).getDate();
    var grid = $('grid');
    grid.innerHTML = '';

    // 连上前后月的日期，固定 6 行 42 格，切月时高度不跳
    var first = new Date(y, m - 1, 1 - offset);
    var cells = Math.max(Math.ceil((offset + n) / 7) * 7, 42);

    for (var i = 0; i < cells; i++) {
      var cur = new Date(first.getFullYear(), first.getMonth(), first.getDate() + i);
      var s = iso(cur);
      var other = (cur.getFullYear() !== y) || (cur.getMonth() + 1 !== m);
      var st = classify(s, parsed);
      var cell = document.createElement('div');
      cell.className = 'd is-' + st.state + (other ? ' other' : '');
      cell.dataset.date = s;
      if (other) { cell.dataset.other = '1'; }
      if (st.kind === 'custom-work') { cell.classList.add('fix-work'); }
      if (st.kind === 'custom-rest') { cell.classList.add('fix-rest'); }
      if (s === TODAY_ISO) { cell.classList.add('today'); }
      if (s === selected) { cell.classList.add('selected'); }

      var lab = '';
      if (st.kind === 'holiday') { lab = (st.name || '休').slice(0, 3); }
      else if (st.kind === 'makeup') { lab = '补班'; }

      var num = document.createElement('div');
      num.className = 'n';
      num.textContent = String(cur.getDate());
      cell.appendChild(num);
      if (lab) {
        var tag = document.createElement('div');
        tag.className = 't mk';
        tag.textContent = lab;
        cell.appendChild(tag);
      }
      if (st.kind === 'custom-work' || st.kind === 'custom-rest') {
        var flag = document.createElement('span');
        flag.className = 'flag';
        flag.textContent = st.kind === 'custom-work' ? '班' : '休';
        cell.appendChild(flag);
        cell.classList.add('has-flag');
      }
      var mk = dayMarks(s);
      if (mk.todo || mk.anniv) {
        var marks = document.createElement('div');
        marks.className = 'marks';
        if (mk.todo) { marks.appendChild(dotOf('t')); }
        if (mk.anniv) { marks.appendChild(dotOf('a')); }
        cell.appendChild(marks);
      }
      var op = openTodosOf(s);               // 格子里直接显示当天首条待办
      if (op.length) {
        var sum = document.createElement('div');
        sum.className = 'tsum';
        sum.textContent = op[0].text;
        sum.title = op.map(function (x) { return x.text; }).join(' / ');
        cell.appendChild(sum);
        if (op.length > 1) {                 // 多条时右下角挂个醒目的数量角标
          var cnt = document.createElement('div');
          cnt.className = 'cnt';
          cnt.textContent = op.length;
          cnt.title = op.length + ' 条未完成待办';
          cell.appendChild(cnt);
          cell.classList.add('has-cnt');
        }
      }
      grid.appendChild(cell);
    }

    var cs = $('customSum');                       // 折叠状态下也能看到有多少条自定义
    if (cs) {
      cs.textContent = (ovr.work.size || ovr.rest.size)
        ? '上班 ' + ovr.work.size + ' · 休息 ' + ovr.rest.size
        : '';
    }

    var s = monthStats(y, m, parsed);
    // 翻到别的月份时，「剩余/总数」这个说法就不成立了，换成该月总数
    var isCurMonth = (y === TODAY.getFullYear() && (m - 1) === TODAY.getMonth());
    if (isCurMonth) {
      $('s-ratio').textContent = s.left + '/' + s.total;
      $('s-ratio-label').textContent = '本月工作日 · 剩余/总数';
    } else {
      $('s-ratio').textContent = String(s.total);
      $('s-ratio-label').textContent = m + ' 月工作日总数 · ' + y + ' 年';
    }
    var ts = classify(TODAY_ISO, parsed);
    $('s-today').textContent = ts.state === 'work' ? '上班' : '休息';
    $('s-today').style.color = ts.state === 'work' ? 'var(--work-tx)' : 'var(--rest-tx)';
    var tsl = $('s-today-label');
    if (tsl) {
      tsl.textContent = '今天 · ' + TODAY.getFullYear() + '年' + (TODAY.getMonth() + 1) + '月' +
        TODAY.getDate() + '日';
    }
    var nh = nextHoliday(parsed, TODAY_ISO);
    if (!nh && nyHol.off.size) {
      nh = nextHoliday({ off: nyHol.off, mk: nyHol.mk, names: nyHol.names }, TODAY_ISO);
    }
    if (nh) {
      // 合并当年与次年数据，数出到假期前还剩几个工作日
      var merged = {
        off: new Set(Array.from(parsed.off).concat(Array.from(nyHol.off))),
        mk: new Set(Array.from(parsed.mk).concat(Array.from(nyHol.mk))),
        names: Object.assign({}, parsed.names, nyHol.names)
      };
      var workLeft = 0;
      var cursor = new Date(TODAY_ISO + 'T00:00:00');
      var stop = new Date(nh.start + 'T00:00:00');
      while (cursor < stop) {
        if (classify(iso(cursor), merged).state === 'work') { workLeft++; }
        cursor = new Date(cursor.getTime() + 86400000);
      }
      var holLabel = nh.name ? ('距离' + nh.name) : '距离下个节假日';
      $('s-holiday').textContent = '';
      var hNum = document.createElement('span');
      hNum.textContent = nh.days;
      var hUnit = document.createElement('i');
      hUnit.className = 'unit';
      hUnit.textContent = '天';
      $('s-holiday').appendChild(hNum);
      $('s-holiday').appendChild(hUnit);
      $('s-holiday-label').textContent = holLabel + ' · 还需上 ' + workLeft + ' 个工作日';
    } else {
      $('s-holiday').textContent = '–';
      $('s-holiday-label').textContent = '距离下个节假日';
    }

    var b = $('banner');
    if (parsed.err) { b.className = 'banner show'; b.textContent = parsed.err; }
    else if (y !== dataYear) {
      b.className = 'banner show';
      b.textContent = '正在查看 ' + y + ' 年，但载入的放假数据是 ' + dataYear + ' 年的，这个月只按周末和你的标记算。';
    } else { b.className = 'banner'; }

  function cycle(dateStr) {
    var parsed = parseYearText(holText);
    var nat = naturalState(dateStr, parsed);
    // 当前是否已经是一个「有意义的自定义标记」（有效状态与自然相反）

    ovr.rest.delete(dateStr);
    if (!isMeaningful) {

      if (nat === 'work') { ovr.rest.add(dateStr); }

  /* ---------------- 接口通信 ---------------- */
  function readHassTokens() {
    try {
      var raw = localStorage.getItem('hassTokens');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function baseURL() {
    // 真机页面与 HA 同源，直接用当前地址；hassUrl 可能是内网地址，不能拿它发请求
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      return location.origin;
    }
    var t = readHassTokens();
    return t && t.hassUrl ? String(t.hassUrl).replace(/\/+$/, '') : '';
  }

  // 同源页面直接借用登录态；过期就用 refresh_token 续一次
  function resolveToken() {
    var nowSec = Math.floor(Date.now() / 1000);
    if (autoToken && autoTokenExp > nowSec + 30) {
      return Promise.resolve(autoToken);
    }
    autoToken = null;
    var t = readHassTokens();
    if (!t || !t.access_token) { return Promise.resolve(null); }
    if (!t.expires || Number(t.expires) > nowSec + 60) {
      autoToken = t.access_token;
      autoTokenExp = Number(t.expires) || (nowSec + 1800);
      return Promise.resolve(autoToken);
    }
    if (!t.refresh_token) { return Promise.resolve(null); }
    var body = new URLSearchParams({
      grant_type: 'refresh_token',
      refresh_token: t.refresh_token,
      client_id: t.clientId || ''
    });
    return fetch(baseURL() + '/auth/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    }).then(function (r) {
      if (!r.ok) { return null; }
      return r.json().then(function (j) {
        if (!j || !j.access_token) { return null; }
        autoToken = j.access_token;
        autoTokenExp = nowSec + (Number(j.expires_in) || 1800);
        return autoToken;
      });
    }).catch(function () { return null; });
  }

  function api(path, opt, retried) {
    return resolveToken().then(function (token) {
      if (!token) { throw new Error('未连接到 Home Assistant'); }
      opt = opt || {};
      // 新 token 必须盖掉重试时带过来的旧 header
      opt.headers = Object.assign({}, opt.headers || {}, {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      });
      return fetch(baseURL() + path, opt).then(function (r) {
        if (r.status === 401 && !retried) {
          autoToken = null;
          autoTokenExp = 0;
          return api(path, opt, true);          // 清掉缓存后重试一次
        }
        if (!r.ok) {
          return r.text().then(function (tt) {
            throw new Error('请求失败 ' + r.status + (tt ? '：' + tt.slice(0, 140) : ''));
          });
        }
        var ct = r.headers.get('content-type') || '';
        return r.text().then(function (txt) {
          if (!txt) { return null; }          // 服务调用常是 200 + 空 body
          if (ct.indexOf('json') >= 0) {
            try { return JSON.parse(txt); } catch (e) { return txt; }
          }
          return txt;
        });
      });
    });
  }
  function callService(service, data, wantResponse) {
    var path = '/api/services/my_workday/' + service +
      (wantResponse ? '?return_response=true' : '');
    return api(path, {
      method: 'POST',
      body: JSON.stringify(data)
    });
  }
  function say(text, type) {

  function loadFromHA(rethrow) {

      ovr.work = new Set(a.custom_work || []);

  /* ---------------- 纪念日 ---------------- */
  var annivs = [];                       // [{name, date, repeat}]

  function annivDaysOf(it) {
    var base = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
    var cand;
    if (it.repeat) {
      var mm = +it.date.slice(0, 2), dd = +it.date.slice(3, 5);
      cand = new Date(base.getFullYear(), mm - 1, dd);
      if (cand < base) { cand = new Date(base.getFullYear() + 1, mm - 1, dd); }
    } else {
      var p = it.date.split('-');
      cand = new Date(+p[0], +p[1] - 1, +p[2]);
    }
    return Math.round((cand - base) / 86400000);
  }

  /* ---------------- 待办 ---------------- */
  function dayItemsOf(todoList, annivList, dateStr) {
    var out = [], i, mmdd = dateStr.slice(5);
    for (i = 0; i < (todoList || []).length; i++) {
      if (todoList[i].date === dateStr) { out.push({ kind: 'todo', ref: todoList[i] }); }
    }
    for (i = 0; i < (annivList || []).length; i++) {
      var a = annivList[i];
      if (a.repeat ? a.date === mmdd : a.date === dateStr) {
        out.push({ kind: 'anniv', ref: a });
      }
    }
    return out;
  }
  function dayMarksOf(todoList, annivList, dateStr) {
    var items = dayItemsOf(todoList, annivList, dateStr), t = false, a = false;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'todo') { t = true; } else { a = true; }
    }
    return { todo: t, anniv: a };
  }
  function dayMarks(dateStr) { return dayMarksOf(todos, annivs, dateStr); }
  function dotOf(cls) {
    var i = document.createElement('i');
    i.className = cls;
    i.textContent = cls === 't' ? '待' : '纪';
    i.title = cls === 't' ? '有待办' : '有纪念日';

  }

  function todoTextOf(list) {
    return (list || []).map(function (t) {
      return (t.done ? '[x] ' : '[ ] ') + t.date + ' ' + t.text;
    }).join('\n');

  function pushTodos() { return callService('set_todos', { data: todoTextOf(todos) }); }
  var todoTimer = null;
  function persistTodos() {

    }, 350);

  function saveTodos() {

    render();

  function deleteTodo(t) {
    var i = todos.indexOf(t);
    if (i >= 0) { todos.splice(i, 1); saveTodos(); }
  }
  /* 待办分组：逾期 / 今天 / 未来 7 天 / 以后 / 已完成 */
  var TODO_GROUPS = [
    { key: 'late', label: '逾期' },
    { key: 'today', label: '今天' },
    { key: 'week', label: '未来 7 天' },
    { key: 'later', label: '以后' },
    { key: 'done', label: '已完成' }
  ];
  var WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  function dayGap(fromISO, toISO) {          // to - from，按天算
    return Math.round((new Date(toISO + 'T00:00:00') - new Date(fromISO + 'T00:00:00')) / 86400000);
  }
  function todoGroupKey(t) {
    if (t.done) { return 'done'; }
    var gap = dayGap(TODAY_ISO, t.date);
    if (gap < 0) { return 'late'; }
    if (gap === 0) { return 'today'; }
    if (gap <= 6) { return 'week'; }
    return 'later';
  }
  function relDayLabel(dateStr) {            // 行右侧的「今天 / 明天 / 逾期 3 天 / 11-27」
    var gap = dayGap(TODAY_ISO, dateStr);
    if (gap < 0) { return '逾期 ' + (-gap) + ' 天'; }
    if (gap === 0) { return '今天'; }
    if (gap === 1) { return '明天'; }
    if (gap === 2) { return '后天'; }
    if (gap <= 6) { return WD[new Date(dateStr + 'T00:00:00').getDay()]; }
    if (dateStr.slice(0, 4) === TODAY_ISO.slice(0, 4)) { return dateStr.slice(5); }
    return dateStr;
  }
  function openTodosOf(dateStr) {            // 当天未完成待办，给格子里的摘要用
    return todos.filter(function (t) { return t.date === dateStr && !t.done; });
  }
  function byDateAsc(a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); }
  function byDateDesc(a, b) { return a.date > b.date ? -1 : (a.date < b.date ? 1 : 0); }

  function todoRow(t) {
    var li = document.createElement('li');
    if (t.done) { li.className = 'done'; }
    else if (t.date < TODAY_ISO) { li.className = 'overdue'; }
    else if (t.date === TODAY_ISO) { li.className = 'today'; }
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'td-cb';
    cb.checked = !!t.done;
    cb.title = t.done ? '标记为未完成' : '标记为完成';
    cb.onchange = function () {
      t.done = cb.checked;
      if (cb.checked) { say('完成：' + t.text, 'ok'); }
      saveTodos();
    };
    var nameEl = document.createElement('span');
    nameEl.className = 'an-name';
    nameEl.textContent = t.text;
    var rel = document.createElement('span');
    rel.className = 'td-rel';
    rel.textContent = relDayLabel(t.date);
    rel.title = t.date + ' ' + WD[new Date(t.date + 'T00:00:00').getDay()];
    var del = document.createElement('button');
    del.type = 'button'; del.className = 'an-del'; del.textContent = '×'; del.title = '删除';
    del.onclick = function () { deleteTodo(t); };
    li.appendChild(cb); li.appendChild(nameEl); li.appendChild(rel); li.appendChild(del);
    return li;
  }

  function renderTodos() {
    var ul = $('todoList');
    if (!ul) { return; }
    var openCnt = todos.filter(function (t) { return !t.done; }).length;
    var sumEl = $('todoSum');
    if (sumEl) {
      sumEl.textContent = openCnt ? ('未完成 ' + openCnt) : (todos.length ? '全部完成' : '');
    }
    ul.innerHTML = '';
    if (!todos.length) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = '还没有待办。在日历格子上右键或长按即可添加。';
      ul.appendChild(empty);
      return;
    }
    var bucket = { late: [], today: [], week: [], later: [], done: [] };
    todos.forEach(function (t) { bucket[todoGroupKey(t)].push(t); });
    bucket.late.sort(byDateAsc);
    bucket.today.sort(byDateAsc);
    bucket.week.sort(byDateAsc);
    bucket.later.sort(byDateAsc);
    bucket.done.sort(byDateDesc);            // 最近完成的排在上

    TODO_GROUPS.forEach(function (g) {
      var list = bucket[g.key];
      if (!list.length) { return; }
      var head = document.createElement('li');
      head.className = 'td-grp' + (g.key === 'late' ? ' late' : '');
      head.appendChild(elOf('span', null, g.label));
      head.appendChild(elOf('span', 'g-n', '· ' + list.length));
      if (g.key === 'done') {
        var tg = elOf('button', 'g-tg', doneOpen ? '收起' : '展开');
        tg.type = 'button';
        head.appendChild(tg);
        head.addEventListener('click', function () { doneOpen = !doneOpen; renderTodos(); });
        ul.appendChild(head);
        if (!doneOpen) { return; }
      } else {
        ul.appendChild(head);
      }
      list.forEach(function (t) { ul.appendChild(todoRow(t)); });
    });
  }

  /* ---------------- 右键 / 长按菜单 ---------------- */
  function elOf(tag, cls, txt) {
    var x = document.createElement(tag);
    if (cls) { x.className = cls; }
    if (txt != null) { x.textContent = txt; }
    return x;

  function ctxOpen(x, y, dateStr) {
    var box = $('ctx');
    if (!box) { return; }
    ctxDate = dateStr;
    ctxMode = 'menu';
    ctxAnchor = { x: x, y: y };
    ctxRender();
    box.classList.add('show');
    ctxPlace(x, y);
  }
  function ctxPlace(x, y) {
    var box = $('ctx');
    if (!box) { return; }
    box.style.left = '8px';
    box.style.top = '8px';
    var w = box.offsetWidth, h = box.offsetHeight;
    // 手机弹出键盘时 window.innerHeight 不变、visualViewport 才变，用小的那个算，别让菜单掉到键盘后面
    var vw = window.innerWidth, vh = window.innerHeight;
    if (window.visualViewport) {
      vw = Math.min(vw, window.visualViewport.width);
      vh = Math.min(vh, window.visualViewport.height);
    }
    var left = Math.min(x, vw - w - 10);
    var top = Math.min(y, vh - h - 10);
    box.style.left = Math.max(8, left) + 'px';
    box.style.top = Math.max(8, top) + 'px';
  }
  function ctxKeepInView() {                 // 视口变化（键盘弹出、旋转）只挪位置，不关菜单
    var box = $('ctx');

    ctxPlace(ctxAnchor.x, ctxAnchor.y);
  }
  function ctxHide() {
    var box = $('ctx');

    ctxMode = 'menu';

  function ctxRender() {
    var box = $('ctx');
    if (!box || !ctxDate) { return; }
    box.innerHTML = '';
    if (ctxMode === 'menu') { ctxMenu(box); }
    else if (ctxMode === 'new') { ctxNewPick(box); }
    else if (ctxMode === 'todoedit') { ctxTodoEditForm(box); }
    else if (ctxMode === 'annivedit') { ctxAnnivEditForm(box); }
    var r = box.getBoundingClientRect();
    if (r.right > window.innerWidth - 8) {
      box.style.left = Math.max(8, window.innerWidth - r.width - 10) + 'px';
    }
    if (r.bottom > window.innerHeight - 8) {
      box.style.top = Math.max(8, window.innerHeight - r.height - 10) + 'px';

  function dayTodosOf(dateStr) {
    return todos.filter(function (t) { return t.date === dateStr; });
  }
  function ctxMenu(box) {
    ctxItemRows(box);                      // 当天的待办 + 纪念日直接列在菜单里

  function dayAnnivsOf(dateStr) {
    return dayItemsOf([], annivs, dateStr).filter(function (it) { return it.kind === 'anniv'; })
      .map(function (it) { return it.ref; });
  }
  function ctxItemRows(box) {             // 菜单里的当日条目：待办（可完成）+ 纪念日（可删）

        return;
      }
      var d = cell.dataset.date;
      if (selected !== d) {                 // 第一次点：只选中，不改状态
        selected = d;
        render();
        say('已选中 ' + d + '，再点切换相反班/休，再点恢复。');
        return;
      }
      cycle(d);                             // 本地切换：相反状态 → 再点恢复
      if (liveHA()) { persistNow(); }       // 真实 HA 环境实时落盘，无需再点保存
      var ck = classify(d, parseYearText(holText)).kind;
      var state = ck === 'custom-work' ? '上班' : (ck === 'custom-rest' ? '休息' : null);
      var tail = liveHA() ? '，已自动保存。' : '（预览模式，改动不会保存，请在 HA 中打开操作）。';
      say(state
        ? d + ' 已设为「' + state + '」' + tail
        : d + ' 已恢复原状' + tail);
    };
    $('customText').oninput = function () {
      var p = parseCustomText(this.value);
      ovr.work = new Set(p.work);
      ovr.rest = new Set(p.rest);
      render();
      if (liveHA()) { persistNow(); }       // 文本框批量改完也即时落盘，无需保存按钮
    };
    loadFold();
    setupFold('custom');
    setupFold('todo');
    setupFold('anniv');
    $('annivAdd').onclick = toggleAnnivForm;
    $('todoAdd').onclick = toggleTodoForm;
    function formKeys(textId, dateId, onSave, onCancel) {
      [textId, dateId].forEach(function (id) {
        var el = $(id);
        if (!el) { return; }
        el.onkeydown = function (e) {
          if (e.key === 'Enter') { onSave(); }
          else if (e.key === 'Escape') { onCancel(); }
        };
      });
    }
    formKeys('todoText', 'todoDate', submitTodo, closeTodoForm);
    formKeys('annivName', 'annivDate', submitAnniv, closeAnnivForm);
    $('annivName').onkeydown = function (e) { if (e.key === 'Enter') { submitAnniv(); } };

    // 右键 / 鼠标按住 / 手机长按 都能弹菜单；长按 600ms 同时选中该格子
    var gridEl = $('grid');
    var lpTimer = null, lpFrom = null;

    function cancelLp() {
      if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
      lpFrom = null;
    }
    function startLp(cell, x, y) {
      cancelLp();
      lpFired = false;                       // 新的一次按下，先清掉上次的标志
      lpFrom = { x: x, y: y };
      var day = cell.dataset.date;
      lpTimer = setTimeout(function () {
        lpTimer = null;
        lpFired = true;                      // 吞掉随后那次 click，别把格子切换状态
        selected = day;                      // 长按顺带选中
        render();
        ctxOpen(x, y, day);
      }, 600);
    }
    function movedTooFar(x, y) {
      return !!lpFrom &&
        (Math.abs(x - lpFrom.x) > 8 || Math.abs(y - lpFrom.y) > 8);
    }

    gridEl.addEventListener('contextmenu', function (e) {
      var cell = e.target.closest('.d');
      if (!cell || !cell.dataset.date) { return; }
      e.preventDefault();
      cancelLp();
      lpFired = false;
      var day = cell.dataset.date;
      if (selected !== day) {                // 右键即选中该格子，选中框跟着菜单走
        selected = day;
        render();
      }
      ctxOpen(e.clientX, e.clientY, day);
    });

    gridEl.addEventListener('touchstart', function (e) {
      var cell = e.target.closest('.d');
      if (!cell || !cell.dataset.date || e.touches.length !== 1) { return; }
      startLp(cell, e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    gridEl.addEventListener('touchmove', function (e) {
      if (!e.touches.length || movedTooFar(e.touches[0].clientX, e.touches[0].clientY)) {
        cancelLp();
      }
    }, { passive: true });
    gridEl.addEventListener('touchend', cancelLp);
    gridEl.addEventListener('touchcancel', cancelLp);

    gridEl.addEventListener('mousedown', function (e) {
      if (e.button !== 0) { return; }        // 右键交给 contextmenu
      var cell = e.target.closest('.d');
      if (!cell || !cell.dataset.date) { return; }
      startLp(cell, e.clientX, e.clientY);
    });
    gridEl.addEventListener('mousemove', function (e) {
      if (movedTooFar(e.clientX, e.clientY)) { cancelLp(); }
    });
    gridEl.addEventListener('mouseup', cancelLp);
    gridEl.addEventListener('mouseleave', cancelLp);

    document.addEventListener('click', function (e) {
      if (lpFired) { return; }               // 长按弹菜单后松手那次 click，不当作「点外面」
      var box = $('ctx');
      if (!box || !box.classList.contains('show')) { return; }
      if (e.target.closest && e.target.closest('#ctx')) { return; }
      ctxHide();
    }, true);
    // 在格子以外重新按下，说明上一轮长按早结束了，标志清掉，别误吞后续点击
    var clearLpFlag = function (e) {
      if (!e.target.closest || !e.target.closest('.d')) { lpFired = false; }
    };
    document.addEventListener('mousedown', clearLpFlag, true);
    document.addEventListener('touchstart', clearLpFlag, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { ctxHide(); }
    });
    // 以前这里直接 ctxHide：手机上点「新增待办」弹出输入框的瞬间，软键盘会让视口变化，
    // 菜单立刻被关掉，根本来不及输入。改成只重新摆位置。
    window.addEventListener('resize', ctxKeepInView);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', ctxKeepInView);
    }
  }

  document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>
