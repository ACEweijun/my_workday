<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作日 · 我的日程</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<header class="bar">
  <b>我的工作日</b>
  <span class="date" id="dateLabel"></span>
</header>
<div id="msg" class="msg" hidden></div>
<main>
  <section class="stats" id="stats"></section>

  <section class="card">
    <div class="card-head">
      <h2 id="calTitle"></h2><span class="spacer"></span>
      <button class="ghost" id="prevM">‹</button>
      <button class="ghost" id="thisM">本月</button>
      <button class="ghost" id="nextM">›</button>
    </div>
    <div class="cal-head" id="calHead"></div>
    <div class="cal" id="cal"></div>
    <div class="hint" id="sourceLabel" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>我的待办</h2><span class="spacer"></span><button class="primary" id="todoAdd">+ 新增</button></div>
    <div class="form" id="todoForm" hidden>
      <div><label>日期</label><input type="date" id="todoDate"></div>
      <div class="full"><label>要做什么</label><input id="todoText" placeholder="回车保存 · Esc 取消"></div>
    </div>
    <div id="todos"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>我的纪念日</h2><span class="spacer"></span><button class="primary" id="annAdd">+ 新增</button></div>
    <div class="form" id="annForm" hidden>
      <div><label>名称</label><input id="annName" placeholder="生日"></div>
      <div><label>日期</label><input id="annDate" placeholder="05-20 或 2026-12-01"></div>
      <div><label>每年重复</label><select id="annRepeat"><option value="1">是</option><option value="0">否</option></select></div>
      <div class="full"><button class="primary" id="annSave">保存</button></div>
    </div>
    <div id="anns"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>我自定义的工作日</h2><span class="spacer"></span><button class="primary" id="customSave">保存</button></div>
    <textarea id="customText" placeholder="上班: 2026-11-28,2026-11-29&#10;休息: 2026-11-27"></textarea>
    <div class="hint" style="margin-top:6px">含「班」的行算上班，含「休 / 假」的行算休息；清空即取消全部自定义。</div>
  </section>

  <section class="card">
    <div class="card-head"><h2>维护到期</h2></div>
    <div id="dueList"></div>
  </section>
</main>
<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MW, $ = M.$, S = null, busy = false, year, month, retries = 0;

  function retryLoad() {
    if (retries >= 3) return;
    retries++;
    setTimeout(load, 2000);
  }
  function load() {
    if (busy || !M.isHA()) return Promise.resolve();
    busy = true;
    return M.snapshot().then(function (d) {
      if (!d || !d.workday) throw new Error('快照数据为空');
      S = d;
      retries = 0;
      var t = M.dateOf(d.today);
      if (year === undefined) { year = t.getFullYear(); month = t.getMonth() + 1; }
      M.setReady(true);
      render();
    }).catch(function (e) {
      M.setReady(false);
      M.toast('加载失败：' + e.message + '，自动重试中', true);
      retryLoad();
    }).finally(function () { busy = false; });
  }
  function write(service, data) {
    return M.call(service, data).then(load).catch(function (e) { M.toast(e.message, true); });
  }
  function iso(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function classify(day) {
    var w = S.workday, h = S.holidays || {}, key = iso(day);
    if ((w.custom_rest || []).indexOf(key) >= 0) return { work: false, label: '休' };
    if ((w.custom_work || []).indexOf(key) >= 0) return { work: true, label: '班' };
    if ((h.makeup || []).indexOf(key) >= 0) return { work: true, label: '补班' };
    if ((h.off || []).indexOf(key) >= 0) return { work: false, label: (h.names || {})[key] || '放假' };
    var g = day.getDay();
    return { work: g >= 1 && g <= 5, label: '' };
  }
  function renderStats() {
    var w = S.workday, st = w.stats || {}, hol = w.next_holiday || {};
    $('dateLabel').textContent = '今天 · ' + S.today;
    var left = st.left == null ? '—' : st.left;
    var total = st.total == null ? '—' : st.total;
    var third = hol.name
      ? '<div class="num orange">' + (hol.days == null ? '—' : hol.days) + ' 天</div><div class="lbl">距' + M.esc(hol.name) + '</div>'
      : '<div class="num red">' + S.maintenance.due_total + ' 项</div><div class="lbl">维护已到期</div>';
    $('stats').innerHTML =
      '<div class="stat"><div class="num blue">' + left + ' / ' + total + '</div><div class="lbl">本月工作日 · 剩余/总数</div></div>' +
      '<div class="stat"><div class="num">' + (w.today_work ? '上班' : '休息') + '</div><div class="lbl">今天 · ' + M.esc(w.today_label || '') + '</div></div>' +
      '<div class="stat">' + third + '</div>';
    $('sourceLabel').textContent = '放假数据：' +
      ({ network: 'holiday-cn 自动获取', manual: '手工覆盖', fallback: '未获取到，按周末规则降级' }[w.holiday_source] || '未获取到');
  }
  function renderCal() {
    $('calTitle').textContent = year + ' 年 ' + month + ' 月';
    $('calHead').innerHTML = ['一', '二', '三', '四', '五', '六', '日']
      .map(function (d) { return '<div>' + d + '</div>'; }).join('');
    var first = new Date(year, month - 1, 1);
    var offset = (first.getDay() + 6) % 7;
    var start = new Date(year, month - 1, 1 - offset);
    var todos = {}, due = {};
    (S.workday.todos || []).forEach(function (t) {
      if (!t.done) todos[t.date] = (todos[t.date] || 0) + 1;
    });
    (S.maintenance.due_items || []).forEach(function (d) {
      due[d.due_date] = (due[d.due_date] || 0) + 1;
    });
    var html = '';
    for (var i = 0; i < 42; i++) {
      var day = new Date(start); day.setDate(start.getDate() + i);
      var key = iso(day), c = classify(day);
      var cls = 'cell ' + (c.work ? 'work' : 'rest') +
        (day.getMonth() + 1 !== month || day.getFullYear() !== year ? ' out' : '') +
        (key === S.today ? ' today' : '');
      var marks = '';
      if (todos[key]) marks += '<span class="mark todo">' + todos[key] + '</span>';
      if (due[key]) marks += '<span class="mark">' + due[key] + '</span>';
      html += '<div class="' + cls + '" data-iso="' + key + '"><span class="d">' + day.getDate() + '</span>' +
        (c.label ? '<span class="lbl">' + M.esc(c.label) + '</span>' : '') +
        '<span class="marks">' + marks + '</span></div>';
    }
    $('cal').innerHTML = html;
  }
  function renderTodos() {
    var list = (S.workday.todos || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    var groups = [['逾期', ''], ['今天', ''], ['未来 7 天', ''], ['以后', ''], ['已完成', '']];
    var buckets = [[], [], [], [], []];
    list.forEach(function (t) {
      if (t.done) { buckets[4].push(t); return; }
      var d = M.dayDiff(t.date, S.today);
      if (d < 0) buckets[0].push(t);
      else if (d === 0) buckets[1].push(t);
      else if (d <= 7) buckets[2].push(t);
      else buckets[3].push(t);
    });
    var html = '';
    groups.forEach(function (g, i) {
      if (!buckets[i].length) return;
      html += '<div class="group">' + g[0] + ' · ' + buckets[i].length + '</div>';
      buckets[i].forEach(function (t) {
        var d = M.dayDiff(t.date, S.today);
        var sub = t.done ? '已完成' : d < 0 ? '逾期 ' + (-d) + ' 天' : d === 0 ? '今天' : d === 1 ? '明天' : t.date.slice(5);
        html += '<div class="row' + (t.done ? ' done' : '') + '">' +
          '<input type="checkbox" style="width:auto" data-todo-check="' + M.esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
          '<span class="txt">' + M.esc(t.text) + '</span><span class="sub">' + sub + '</span>' +
          '<button class="ghost danger" data-todo-del="' + M.esc(t.id) + '">×</button></div>';
      });
    });
    $('todos').innerHTML = html || '<div class="hint">还没有待办。</div>';
  }
  function saveTodos(next) { return write('set_todos', { todos: next }); }
  function renderAnns() {
    var list = (S.workday.anniversaries || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    $('anns').innerHTML = list.length ? list.map(function (a) {
      return '<div class="row"><span class="txt">' + M.esc(a.name) + '</span>' +
        '<span class="sub">' + M.esc(a.date) + (a.repeat ? ' · 每年' : '') + '</span>' +
        '<button class="ghost danger" data-ann-del="' + M.esc(a.id) + '">×</button></div>';
    }).join('') : '<div class="hint">还没有纪念日。</div>';
  }
  function renderCustom() {
    var w = S.workday;
    $('customText').value = '上班: ' + (w.custom_work || []).join(',') + '\n休息: ' + (w.custom_rest || []).join(',');
  }
  function renderDue() {
    var list = S.maintenance.due_items || [];
    $('dueList').innerHTML = list.length ? list.slice(0, 12).map(function (d) {
      return '<div class="row"><span class="pill ' + (d.status === 'due' ? 'due' : 'soon') + '">' +
        (d.status === 'due' ? '已到期' : '快到了') + '</span>' +
        '<span class="txt">' + M.esc(d.project) + ' · ' + M.esc(d.name) + '</span>' +
        '<span class="sub">' + M.esc(d.due_date) + '</span></div>';
    }).join('') : '<div class="hint">目前没有到期或快到期的维护项。</div>';
  }
  function render() { renderStats(); renderCal(); renderTodos(); renderAnns(); renderCustom(); renderDue(); }

  $('prevM').onclick = function () { month--; if (month < 1) { month = 12; year--; } renderCal(); };
  $('nextM').onclick = function () { month++; if (month > 12) { month = 1; year++; } renderCal(); };
  $('thisM').onclick = function () { var t = M.dateOf(S.today); year = t.getFullYear(); month = t.getMonth() + 1; renderCal(); };
  $('cal').onclick = function (e) {
    var cell = e.target.closest('[data-iso]'); if (!cell || !S) return;
    var key = cell.dataset.iso, w = S.workday;
    var mode = (w.custom_rest || []).indexOf(key) >= 0 || (w.custom_work || []).indexOf(key) >= 0
      ? 'auto' : (classify(M.dateOf(key)).work ? 'rest' : 'work');
    write('set_day', { date: key, mode: mode });
  };
  $('todoAdd').onclick = function () {
    var f = $('todoForm'); f.hidden = !f.hidden;
    if (!f.hidden) { $('todoDate').value = S.today; $('todoText').value = ''; $('todoText').focus(); }
  };
  $('todoText').onkeydown = function (e) {
    if (e.key === 'Escape') { $('todoForm').hidden = true; return; }
    var text = $('todoText').value.trim();
    if (e.key !== 'Enter' || !text) return;
    var next = (S.workday.todos || []).slice();
    next.push({ id: 't' + Date.now().toString(36), date: $('todoDate').value || S.today, text: text, done: false });
    $('todoForm').hidden = true;
    saveTodos(next);
  };
  $('todos').onclick = function (e) {
    var del = e.target.dataset.todoDel;
    if (del) { saveTodos((S.workday.todos || []).filter(function (t) { return t.id !== del; })); return; }
    var chk = e.target.dataset.todoCheck;
    if (chk) {
      var next = (S.workday.todos || []).map(function (t) {
        return t.id === chk ? Object.assign({}, t, { done: e.target.checked }) : t;
      });
      saveTodos(next);
    }
  };
  $('annAdd').onclick = function () { var f = $('annForm'); f.hidden = !f.hidden; if (!f.hidden) $('annName').focus(); };
  $('annSave').onclick = function () {
    var name = $('annName').value.trim(), date = $('annDate').value.trim();
    if (!name || !date) { M.toast('名称和日期都要填', true); return; }
    var next = (S.workday.anniversaries || []).slice();
    next.push({ id: 'a' + Date.now().toString(36), name: name, date: date, repeat: $('annRepeat').value === '1' });
    $('annForm').hidden = true;
    write('set_anniversaries', { anniversaries: next });
  };
  $('anns').onclick = function (e) {
    var id = e.target.dataset.annDel; if (!id) return;
    write('set_anniversaries', {
      anniversaries: (S.workday.anniversaries || []).filter(function (a) { return a.id !== id; })
    });
  };
  $('customSave').onclick = function () {
    var work = [], rest = [];
    $('customText').value.split('\n').forEach(function (line) {
      var dates = (line.match(/\d{4}-\d{2}-\d{2}/g) || []).join(',');
      if (!dates) return;
      if (line.indexOf('班') >= 0) work.push(dates);
      else if (line.indexOf('休') >= 0 || line.indexOf('假') >= 0) rest.push(dates);
    });
    write('set_custom', { work: work.join(','), rest: rest.join(',') });
  };
  M.onUpdate(load);
  M.start();
  load();
})();
</script>
</body>
</html>
