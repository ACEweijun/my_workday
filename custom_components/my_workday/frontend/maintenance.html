<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>维护台账 · 我的日程</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="msg" class="msg" hidden></div>

<main class="mt-layout">
  <aside class="mt-side" id="projSide"></aside>
  <div class="mt-main">
    <section class="card">
      <div class="card-head proj-head"><h2 id="projectHead" class="proj-title" title="点击编辑项目">维护项目</h2><span class="spacer"></span>
        <span class="hint" id="projectType"></span>
        <button class="primary" id="logOpen">记录多项维护</button></div>
      <div class="stats" id="overview"></div>
      <div class="form" id="counterBox" hidden>
        <div><label id="counterLabel">当前计数</label><input type="number" id="counterValue"></div>
      </div>
      <div class="hint" id="projHint">还没有项目，点「+ 新建」。</div>
    </section>

    <section class="card">
      <div class="card-head"><h2>维护小项</h2><span class="spacer"></span>
        <button class="primary" id="itemAdd">+ 新增小项</button></div>
      <div id="items"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>历史记录</h2><span class="spacer"></span><span class="hint" id="historyCount"></span></div>
      <div class="hint" style="margin-bottom:6px">点任意一行可编辑这次维护的日期、计数与各小项备注。</div>
      <div id="history"></div>
    </section>
  </div>
</main>

<div class="modal-mask" id="projMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="projTitle">
    <div class="modal-head"><b id="projTitle">新建维护项目</b>
      <button class="ghost" id="projClose" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div><label>项目名称</label><input id="projName" placeholder="卡罗拉"></div>
      <div><label>这个项目要计数吗</label><select id="projCounter">
        <option value="0">不要</option><option value="1">要</option></select></div>
      <div id="unitBox" hidden><label>计数单位</label><input id="projUnit" placeholder="公里 / 次 / 小时"></div>
      <div class="full"><button class="primary" id="projSave">创建</button>
        <button class="ghost" id="projCancel">取消</button></div>
      <div class="full modal-extra" id="projExtra" hidden>
        <button class="ghost" id="projExportJson">导出当前项目 JSON</button>
        <button class="ghost" id="projExportMd">导出 Markdown</button>
        <button class="ghost danger" id="projDelete">删除项目</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-mask" id="itemMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <div class="modal-head"><b id="itemTitle">新增维护小项</b>
      <button class="ghost" id="itemClose" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="itemId">
      <div><label>维护内容</label><input id="itemName" placeholder="机油 + 机滤"></div>
      <div><label>间隔天数</label><input type="number" id="itemDays" value="180"></div>
      <div id="itemIntervalBox" hidden><label>间隔计数（可留空）</label><input type="number" id="itemInterval" placeholder="10000"></div>
      <div><label>备注</label><input id="itemNote"></div>
      <div class="full"><button class="primary" id="itemSave">保存</button>
        <button class="ghost" id="itemCancel">取消</button></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="logMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <div class="modal-head"><b id="logTitle">记录多项维护</b>
      <button class="ghost" id="logClose" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <div><label>维护日期</label><input type="date" id="logDate"></div>
      <div id="logCounterBox" hidden><label id="logCounterLabel">当前计数</label><input type="number" id="logCounter"></div>
      <div><span class="hint">勾哪行就记哪行，每行可写自己的备注；填了计数会同步更新当前计数。</span></div>
      <div id="logItems"></div>
      <div class="full"><button class="primary" id="logSave">保存这次维护</button>
        <button class="ghost" id="logCancel">取消</button></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="recMask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="recTitle">
    <div class="modal-head"><b id="recTitle">编辑维护记录</b>
      <button class="ghost" id="recClose" aria-label="关闭">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="recId">
      <div><label>日期</label><input type="date" id="recDate"></div>
      <div id="recCounterBox" hidden><label id="recCounterLabel">当前计数</label><input type="number" id="recCounter"></div>
      <div><span class="hint">每行可改备注或删除该小项；全部删完等于删除这次记录。</span></div>
      <div id="recEntries"></div>
      <div class="full"><button class="primary" id="recSave">保存</button>
        <button class="ghost" id="recCancel">取消</button></div>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MW, $ = M.$, S = null, busy = false, slug = null, expanded = {}, retries = 0;
  var editingSlug = null, lastCount = null, pendingDel = null, recRemoved = [];
  var MASKS = ['projMask', 'itemMask', 'logMask', 'recMask'];

  function armDel(k) {
    if (pendingDel !== k) { pendingDel = k; return false; }
    pendingDel = null; return true;
  }
  function delText(k) { return pendingDel === k ? '确认删除' : '删除'; }
  function retryLoad() { if (retries >= 3) return; retries++; setTimeout(load, 2000); }
  function load() {
    if (busy || !M.isHA()) return Promise.resolve();
    busy = true;
    return M.snapshot().then(function (d) {
      if (!d || !d.maintenance) throw new Error('快照格式异常：' + JSON.stringify(d).slice(0, 160));
      S = d; retries = 0;
      var projects = d.maintenance.projects || [];
      if (!projects.length) slug = null;
      else if (!projects.some(function (p) { return p.slug === slug; })) slug = projects[0].slug;
      M.setReady(true);
      render();
    }).catch(function (e) {
      M.setReady(false);
      M.toast('加载失败：' + e.message + '，自动重试中', true);
      retryLoad();
    }).finally(function () { busy = false; });
  }
  function write(service, data) {
    return M.call(service, data).then(load).catch(function (e) { M.toast(e.message, true); });
  }
  function project() {
    return (S.maintenance.projects || []).filter(function (p) { return p.slug === slug; })[0] || null;
  }
  function summary() {
    return (S.maintenance.summaries || []).filter(function (p) { return p.slug === slug; })[0] || null;
  }
  function stateOf(id) {
    var s = summary();
    return (s && (s.items || []).filter(function (i) { return i.id === id; })[0]) || {};
  }
  function pill(st) {
    var labels = { due: '已到期', soon: '快到了', ok: '正常', unset: '未设基准' };
    return '<span class="pill ' + st + '">' + (labels[st] || st) + '</span>';
  }
  function download(name, text, type) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain;charset=utf-8' }));
    a.download = name; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function hideModals() { MASKS.forEach(function (id) { $(id).hidden = true; }); }
  function resetForms() {
    hideModals();
    $('itemId').value = ''; $('recId').value = '';
    editingSlug = null; pendingDel = null; recRemoved = [];
  }
  function render() {
    renderSide(); renderOverview(); renderItems(); renderHistory();
    if (!$('logMask').hidden) renderLogItems();
  }
  function renderSide() {
    var list = S.maintenance.projects || [];
    $('projHint').hidden = list.length > 0;
    $('projSide').innerHTML = list.map(function (p) {
      var s = (S.maintenance.summaries || []).filter(function (x) { return x.slug === p.slug; })[0] || {};
      var on = p.slug === slug;
      return '<button class="tab' + (on ? ' on' : '') + '" data-tab="' + M.esc(p.slug) + '"' +
        (on ? ' title="再点一次编辑项目"' : ' title="切换到这个项目"') + '>' +
        M.esc(p.name) + (s.due_count ? '<span class="badge">' + s.due_count + '</span>' : '') + '</button>';
    }).join('') + '<button class="tab add primary" id="projAdd">+ 新建</button>';
  }
  function renderOverview() {
    var p = project(), s = summary();
    if (!p || !s) {
      $('projectHead').textContent = '维护项目';
      $('projectType').textContent = '';
      $('overview').innerHTML = '<div class="stat"><div class="num">—</div><div class="lbl">尚无项目</div></div>';
      $('counterBox').hidden = true;
      return;
    }
    $('projectHead').textContent = p.name;
    var labels = { vehicle: '车辆', appliance: '家电', furniture: '家具', area: '区域', custom: '自己建' };
    $('projectType').textContent = labels[p.type] || '';
    $('overview').innerHTML =
      '<div class="stat"><div class="num red">' + s.due_count + '</div><div class="lbl">已到期</div></div>' +
      '<div class="stat"><div class="num orange">' + s.soon_count + '</div><div class="lbl">快到了</div></div>';
    $('counterBox').hidden = !p.need_counter;
    if (p.need_counter) {
      $('counterLabel').textContent = '更新当前' + (p.counter_label || '计数') + '（' + (p.counter_unit || '') + '）';
      $('logCounterLabel').textContent = '当前' + (p.counter_label || '计数');
      $('recCounterLabel').textContent = '当前' + (p.counter_label || '计数');
      if (lastCount !== p.counter) {
        $('counterValue').value = p.counter == null ? '' : p.counter;
        lastCount = p.counter;
      }
    }
  }
  function itemRecords(p, itemId) {
    return (p.history || []).filter(function (r) {
      return (r.entries || []).some(function (e) { return e.item_id === itemId; });
    }).sort(function (a, b) { return b.date.localeCompare(a.date); });
  }
  function renderItems() {
    var p = project();
    if (!p) { $('items').innerHTML = '<div class="hint">先新建一个项目。</div>'; return; }
    $('items').innerHTML = (p.items || []).map(function (i) {
      var st = stateOf(i.id);
      var left = st.remaining_days == null ? '—' : (st.remaining_days <= 0 ? '已到期' : '还剩 ' + st.remaining_days + ' 天');
      var recs = itemRecords(p, i.id);
      var head = '<div class="mt-item"><div class="top item-title" data-item="' + M.esc(i.id) + '" title="点击编辑">' +
        '<b>' + M.esc(i.name) + '</b>' + pill(st.status) + '</div>' +
        '<div class="meta">上次维护：' + M.esc(i.last_date || '未设') + ' · ' + left +
        (p.need_counter && st.remaining_counter != null ? ' · 还剩 ' + st.remaining_counter + ' ' + M.esc(p.counter_unit || '') : '') +
        '</div>' +
        (i.note ? '<div class="meta">' + M.esc(i.note) + '</div>' : '') +
        '<div class="acts">' +
        '<button data-history="' + M.esc(i.id) + '">维护记录 (' + recs.length + ') ' + (expanded[i.id] ? '▴' : '▾') + '</button>' +
        '<button class="danger" data-del="' + M.esc(i.id) + '">' + delText('item:' + i.id) + '</button></div>';
      if (!expanded[i.id]) return head + '</div>';
      var rows = recs.length ? recs.map(function (r) {
        var e = (r.entries || []).filter(function (x) { return x.item_id === i.id; })[0] || {};
        return '<div class="row rec-row" data-rec="' + M.esc(r.id) + '" title="点击编辑这次维护">' +
          '<span class="sub">' + M.esc(r.date) + (r.counter != null ? ' · ' + M.esc(r.counter) : '') + '</span>' +
          '<span class="txt">' + M.esc(e.note || '') + '</span></div>';
      }).join('') : '<div class="hint">这条小项还没有记录。</div>';
      return head + '<div class="sub-list">' + rows + '</div></div>';
    }).join('') || '<div class="hint">还没有维护小项。</div>';
  }
  function renderHistory() {
    var p = project();
    if (!p) { $('history').innerHTML = '<div class="hint">—</div>'; $('historyCount').textContent = ''; return; }
    var rows = (p.history || []).slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    $('historyCount').textContent = rows.length + ' 次';
    $('history').innerHTML = rows.length ? rows.slice(0, 30).map(function (r) {
      var names = (r.entries || []).map(function (e) {
        var it = (p.items || []).filter(function (i) { return i.id === e.item_id; })[0];
        return it ? it.name : e.item_id;
      });
      return '<div class="row rec-row" data-rec="' + M.esc(r.id) + '" title="点击编辑这次维护">' +
        '<span class="sub">' + M.esc(r.date) + '</span>' +
        '<span class="txt">' + M.esc(names.join('、')) + '</span>' +
        '<span class="sub">' + M.esc(r.counter == null ? '' : r.counter) + '</span></div>';
    }).join('') : '<div class="hint">还没有维护记录。</div>';
    if (rows.length > 30) $('history').innerHTML += '<div class="hint">还有 ' + (rows.length - 30) + ' 次未显示</div>';
  }
  function renderLogItems() {
    var p = project(); if (!p) { $('logItems').innerHTML = ''; return; }
    var kept = Array.prototype.slice.call(document.querySelectorAll('[data-logitem]:checked'))
      .map(function (x) { return x.value; });
    var notes = {};
    Array.prototype.slice.call(document.querySelectorAll('[data-lognote]')).forEach(function (x) {
      notes[x.dataset.lognote] = x.value;
    });
    $('logItems').innerHTML = '<table class="logtable"><tr><th>记</th><th>维护小项</th><th>备注</th></tr>' +
      (p.items || []).map(function (i) {
        return '<tr><td><input type="checkbox" style="width:auto" value="' + M.esc(i.id) + '" data-logitem' +
          (kept.indexOf(i.id) >= 0 ? ' checked' : '') + '></td><td>' + M.esc(i.name) +
          '</td><td><input type="text" data-lognote="' + M.esc(i.id) + '" value="' +
          M.esc(notes[i.id] || '') + '" placeholder="备注"></td></tr>';
      }).join('') + '</table>';
  }
  function defaultLabel(unit) {
    return ({ '公里': '里程', '次': '使用次数', '小时': '运行小时' })[unit] || unit;
  }
  function syncUnit() { $('unitBox').hidden = $('projCounter').value !== '1'; }
  function autoSlug(name) {
    var clean = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    if (clean) return clean;
    var h = 5381;
    for (var i = 0; i < name.length; i++) h = ((h * 33) ^ name.charCodeAt(i)) >>> 0;
    return 'p_' + h.toString(36);
  }
  function openForm(edit) {
    resetForms();
    editingSlug = edit ? slug : null;
    $('projMask').hidden = false;
    $('projTitle').textContent = edit ? '编辑项目' : '新建维护项目';
    $('projSave').textContent = edit ? '保存修改' : '创建';
    $('projExtra').hidden = !edit;
    $('projDelete').textContent = '删除项目';
    var p = project();
    if (edit && p) {
      $('projName').value = p.name;
      $('projCounter').value = p.need_counter ? '1' : '0';
      $('projUnit').value = p.counter_unit || '';
    } else {
      $('projName').value = ''; $('projCounter').value = '0'; $('projUnit').value = '';
    }
    syncUnit();
    $('projName').focus();
  }
  function submitProject() {
    var name = $('projName').value.trim();
    var unit = $('projUnit').value.trim();
    var need = $('projCounter').value === '1';
    if (!name) { M.toast('项目名称不能为空', true); return; }
    if (need && !unit) { M.toast('要计数请填单位', true); return; }
    var data = { name: name, need_counter: need,
      counter_unit: need ? unit : '', counter_label: need ? defaultLabel(unit) : '' };
    hideModals();
    if (editingSlug) {
      data.slug = editingSlug; editingSlug = null;
      write('update_project', data);
    } else {
      var gen = autoSlug(name);
      data.slug = gen; slug = gen; lastCount = null;
      write('add_project', data);
    }
  }
  function exportProject(kind) {
    var p = project(); if (!p) return;
    if (kind === 'json') {
      download(p.slug + '.json', JSON.stringify(p, null, 2), 'application/json');
    } else {
      M.call('export_markdown', { slug: p.slug }, true).then(function (r) {
        download(p.slug + '.md', (r && r.markdown) || '', 'text/markdown;charset=utf-8');
      }).catch(function (err) { M.toast(err.message, true); });
    }
  }
  function deleteProject() {
    if (!editingSlug) return;
    if (!armDel('project')) { $('projDelete').textContent = '确认删除'; return; }
    var target = editingSlug;
    slug = null; lastCount = null;
    hideModals();
    write('delete_project', { slug: target });
  }
  function openItemForm(id) {
    var p = project(); if (!p) return;
    resetForms();
    $('itemMask').hidden = false;
    $('itemTitle').textContent = id ? '编辑维护小项' : '新增维护小项';
    var i = id ? (p.items || []).filter(function (x) { return x.id === id; })[0] : null;
    $('itemId').value = i ? i.id : '';
    $('itemName').value = i ? i.name : '';
    $('itemDays').value = i ? (i.interval_days == null ? '' : i.interval_days) : 180;
    $('itemIntervalBox').hidden = !p.need_counter;
    $('itemInterval').value = p.need_counter && i && i.interval_counter != null ? i.interval_counter : '';
    $('itemNote').value = i ? (i.note || '') : '';
    $('itemName').focus();
  }
  function openLogForm() {
    var p = project();
    if (!p) { M.toast('先新建一个项目', true); return; }
    resetForms();
    $('logMask').hidden = false;
    $('logDate').value = S.today;
    $('logCounterBox').hidden = !p.need_counter;
    $('logCounterLabel').textContent = '当前' + (p.counter_label || '计数');
    $('logCounter').value = p.counter == null ? '' : p.counter;
    renderLogItems();
  }
  function openRecForm(recordId) {
    var p = project(); if (!p) return;
    var rec = (p.history || []).filter(function (r) { return r.id === recordId; })[0];
    if (!rec) return;
    resetForms();
    $('recMask').hidden = false;
    $('recId').value = recordId;
    $('recDate').value = rec.date || S.today;
    $('recCounterBox').hidden = !p.need_counter;
    $('recCounterLabel').textContent = '当前' + (p.counter_label || '计数');
    $('recCounter').value = rec.counter == null ? '' : rec.counter;
    $('recEntries').innerHTML = (rec.entries || []).map(function (e) {
      var it = (p.items || []).filter(function (i) { return i.id === e.item_id; })[0];
      return '<div class="rec-ent" data-renoterow="' + M.esc(e.item_id) + '">' +
        '<span class="rec-name">' + M.esc(it ? it.name : e.item_id) + '</span>' +
        '<input type="text" data-renote="' + M.esc(e.item_id) + '" value="' +
        M.esc(e.note || '') + '" placeholder="备注">' +
        '<button class="ghost danger" data-renotedel="' + M.esc(e.item_id) + '">删除</button></div>';
    }).join('') || '<div class="hint">这次记录没有条目。</div>';
    $('recDate').focus();
  }
  function saveRecForm() {
    var date = $('recDate').value;
    if (!date) { M.toast('日期要填', true); return; }
    var recId = $('recId').value, p = project();
    if (!p) return;
    var raw = String($('recCounter').value == null ? '' : $('recCounter').value).trim();
    var counter = raw === '' ? null : Number(raw);
    if (counter != null && !isFinite(counter)) { M.toast('计数值不合法', true); return; }
    var notes = [];
    Array.prototype.slice.call(document.querySelectorAll('[data-renote]')).forEach(function (x) {
      notes.push({ item_id: x.dataset.renote, note: x.value });
    });
    var ops = [];
    recRemoved.forEach(function (id) {
      ops.push(function () {
        return M.call('delete_record', { slug: slug, record_id: recId, item_id: id });
      });
    });
    notes.forEach(function (n) {
      ops.push(function () {
        return M.call('update_record', { slug: slug, record_id: recId, item_id: n.item_id,
          date: date, counter: counter, note: n.note });
      });
    });
    hideModals();
    var chain = Promise.resolve();
    ops.forEach(function (f) { chain = chain.then(f); });
    chain.then(load).catch(function (e) { M.toast(e.message, true); });
  }

  $('projSide').onclick = function (e) {
    var add = e.target.closest && e.target.closest('#projAdd');
    if (add) { openForm(false); return; }
    var t = e.target.closest && e.target.closest('[data-tab]'); if (!t) return;
    var target = t.dataset.tab;
    if (target === slug) { openForm(true); return; }
    slug = target; expanded = {}; lastCount = null; resetForms(); render();
  };
  $('projectHead').onclick = function () {
    if (!project()) { M.toast('先新建一个项目', true); return; }
    openForm(true);
  };
  $('projCounter').onchange = syncUnit;
  $('projSave').onclick = submitProject;
  $('projCancel').onclick = resetForms;
  $('projClose').onclick = resetForms;
  $('projExportJson').onclick = function () { exportProject('json'); };
  $('projExportMd').onclick = function () { exportProject('md'); };
  $('projDelete').onclick = deleteProject;
  $('counterValue').onchange = function () {
    var p = project(); if (!p) return;
    var raw = String($('counterValue').value == null ? '' : $('counterValue').value).trim();
    if (raw === '' || !isFinite(Number(raw))) { M.toast('请填写有效的计数值', true); return; }
    write('set_counter', { slug: p.slug, value: Number(raw) });
  };
  $('logOpen').onclick = openLogForm;
  $('logCancel').onclick = function () { $('logMask').hidden = true; };
  $('logClose').onclick = function () { $('logMask').hidden = true; };
  $('logSave').onclick = function () {
    var ids = Array.prototype.slice.call(document.querySelectorAll('[data-logitem]:checked')).map(function (x) { return x.value; });
    if (!ids.length) { M.toast('至少勾选一个小项', true); return; }
    if (!$('logDate').value) { M.toast('维护日期要填', true); return; }
    var notes = {};
    Array.prototype.slice.call(document.querySelectorAll('[data-lognote]')).forEach(function (x) {
      notes[x.dataset.lognote] = x.value;
    });
    var data = { slug: slug, item_ids: ids, date: $('logDate').value, item_notes: notes };
    if ($('logCounter').value !== '') data.counter = Number($('logCounter').value);
    hideModals();
    var btn = this; btn.disabled = true;
    write('log_service', data).finally(function () { btn.disabled = false; });
  };
  $('itemAdd').onclick = function () { openItemForm(null); };
  $('itemCancel').onclick = function () { $('itemMask').hidden = true; };
  $('itemClose').onclick = function () { $('itemMask').hidden = true; };
  $('itemSave').onclick = function () {
    var id = $('itemId').value;
    var data = { slug: slug, name: $('itemName').value.trim(),
      interval_days: Number($('itemDays').value), note: $('itemNote').value };
    if ($('itemInterval').value !== '') data.interval_counter = Number($('itemInterval').value);
    if (!data.name) { M.toast('维护内容不能为空', true); return; }
    if (String($('itemDays').value == null ? '' : $('itemDays').value).trim() === '') { M.toast('间隔天数要填', true); return; }
    if (id) { data.item_id = id; write('update_item', data); }
    else write('add_item', data);
    hideModals();
  };
  $('items').onclick = function (e) {
    var p = project(); if (!p) return;
    var t = e.target;
    var rec = t.closest && t.closest('[data-rec]');
    if (rec) { openRecForm(rec.dataset.rec); return; }
    var title = t.closest && t.closest('[data-item]');
    if (title) { openItemForm(title.dataset.item); return; }
    var del = t.dataset.del;
    if (del) {
      if (!armDel('item:' + del)) { renderItems(); return; }
      write('delete_item', { slug: slug, item_id: del }); return;
    }
    var hist = t.dataset.history;
    if (hist) { expanded[hist] = !expanded[hist]; renderItems(); return; }
  };
  $('history').onclick = function (e) {
    var row = e.target.closest && e.target.closest('[data-rec]');
    if (row) openRecForm(row.dataset.rec);
  };
  $('recEntries').onclick = function (e) {
    var id = e.target.dataset && e.target.dataset.renotedel;
    if (!id) return;
    if (!armDel('rec:' + id)) { e.target.textContent = '确认删除'; return; }
    recRemoved.push(id);
    var row = e.target.closest && e.target.closest('[data-renoterow]');
    if (row && row.parentNode) row.parentNode.removeChild(row);
  };
  $('recCancel').onclick = function () { $('recMask').hidden = true; };
  $('recClose').onclick = function () { $('recMask').hidden = true; };
  $('recSave').onclick = saveRecForm;
  MASKS.forEach(function (id) {
    $(id).onclick = function (e) { if (e.target === this) hideModals(); };
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') hideModals();
  });
  M.onUpdate(load);
  M.start();
  load();
})();
</script>
</body>
</html>
