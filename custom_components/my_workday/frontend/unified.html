<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日程 · 日期待办与维护台账</title>
<style>
:root{--bg:#ffffff;--text:#1c1d1f;--muted:#6b7075;--line:rgba(0,0,0,.12);--accent:#2f6fd0;--accent-soft:#e7f0fb;--danger:#c0392b;--danger-soft:#fdeceb;--soft:#f4f5f7}
.dark{--bg:#17191c;--text:#e9eaec;--muted:#9aa0a6;--line:rgba(255,255,255,.14);--accent:#7fb0f2;--accent-soft:#1e3553;--danger:#f08a80;--danger-soft:#452422;--soft:#22252a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;flex:none;padding:7px 10px;border-bottom:.5px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:6px;min-width:0}
button{font:inherit;font-size:13px;line-height:1.2;padding:6px 12px;border:.5px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;white-space:nowrap}
button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.badge{display:inline-block;min-width:16px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--danger-soft);color:var(--danger);font-size:11px;line-height:16px;text-align:center}
.badge[hidden]{display:none}
.right{margin-left:auto;display:flex;align-items:center;gap:8px}
.hint{font-size:11px;color:var(--muted)}
.hint[hidden]{display:none}
.panes{position:relative;flex:1;min-height:0}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none}
iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.ph{box-sizing:border-box;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;color:var(--muted)}
.ph b{color:var(--text);font-size:15px;font-weight:500}
.ph code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--accent);background:var(--soft);padding:2px 6px;border-radius:5px}
@media (max-width:420px){.bar{padding:6px 8px}.tabs{gap:4px}button{padding:6px 9px}.hint{display:none}}
</style>
<script>
(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.className='dark'})();
</script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="tabs">
      <button id="tab-workday" type="button" aria-pressed="true">日期待办</button>
      <button id="tab-maintenance" type="button" aria-pressed="false">维护台账<span id="badge" class="badge" hidden></span></button>
    </div>
    <div class="right">
      <span id="hint" class="hint" hidden>预览模式</span>
      <button id="refresh" type="button" title="重新加载当前页面">刷新</button>
    </div>
  </header>
  <main class="panes">
    <div id="pane-workday" class="pane">
      <div class="ph">
        <b>日期待办</b>
        <div>部署后这里显示「我的工作日」日历</div>
        <code>/my_workday/workday.html</code>
      </div>
    </div>
    <div id="pane-maintenance" class="pane" hidden>
      <div class="ph">
        <b>维护台账</b>
        <div>部署后这里显示「我的维护台账」</div>
        <code>/my_maintenance/maintenance.html</code>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var BADGE_ENTITY='sensor.my_maintenance_all_due_count';
var REFRESH_MS=300000;
var SRC={workday:'/my_workday/workday.html',maintenance:'/my_maintenance/maintenance.html'};
var TITLE={workday:'我的工作日',maintenance:'维护台账'};
var frames={workday:null,maintenance:null};
var token=null,tokenExp=0,current='workday';
var $=function(id){return document.getElementById(id)};
var isHA=function(){
  if(location.protocol!=='http:'&&location.protocol!=='https:')return false;
  if(new URLSearchParams(location.search).get('local')==='1')return true;
  var p=location.pathname;
  return p.indexOf('/local/')>=0||p.indexOf('/my_workday/')>=0||p.indexOf('/my_maintenance/')>=0;
};
var baseURL=function(){return isHA()?location.origin:''};
function readTokens(){try{var raw=localStorage.getItem('hassTokens');return raw?JSON.parse(raw):null}catch(e){return null}}
function resolveToken(){
  var now=Math.floor(Date.now()/1000);
  if(token&&tokenExp>now+30)return Promise.resolve(token);
  var t=readTokens();
  if(!t||!t.access_token)return Promise.resolve(null);
  if(!t.expires||Number(t.expires)>now+60){token=t.access_token;tokenExp=Number(t.expires)||now+1800;return Promise.resolve(token)}
  if(!t.refresh_token||!isHA())return Promise.resolve(null);
  var body=new URLSearchParams({grant_type:'refresh_token',refresh_token:t.refresh_token,client_id:t.clientId||''});
  return fetch(baseURL()+'/auth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()})
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){if(!j||!j.access_token)return null;token=j.access_token;tokenExp=now+(Number(j.expires_in)||1800);return token})
    .catch(function(){return null});
}
function api(path,retried){
  return resolveToken().then(function(tk){
    if(!tk)throw new Error('no token');
    return fetch(baseURL()+path,{headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'}});
  }).then(function(r){
    if(r.status===401&&!retried){token=null;tokenExp=0;return api(path,true)}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  });
}
function setBadge(n){
  var el=$('badge');
  if(n===null||!isFinite(n)||n<=0){el.hidden=true;el.textContent='';return}
  el.hidden=false;el.textContent=String(Math.round(n));
}
function fallbackBadge(){
  return api('/api/states').then(function(list){
    var n=0;
    for(var i=0;i<list.length;i++){
      var row=list[i],id=row.entity_id||'';
      if(id.indexOf('sensor.my_maintenance_')===0&&id.indexOf('_all_')<0&&/_due_count$/.test(id)){
        var v=Number(row.state);
        if(isFinite(v))n+=v;
      }
    }
    return n;
  });
}
function loadBadge(){
  if(!isHA())return;
  resolveToken().then(function(tk){
    if(!tk){setBadge(null);return}
    api('/api/states/'+BADGE_ENTITY).then(function(st){
      var n=Number(st.state);
      if(!isFinite(n))throw new Error('unavailable');
      return n;
    }).catch(fallbackBadge).then(setBadge).catch(function(){setBadge(null)});
  }).catch(function(){setBadge(null)});
}
function ensureFrame(name){
  if(frames[name]||!isHA())return frames[name];
  var pane=$('pane-'+name);
  pane.innerHTML='';
  var f=document.createElement('iframe');
  f.src=SRC[name];
  f.title=TITLE[name];
  f.setAttribute('allow','fullscreen');
  pane.appendChild(f);
  frames[name]=f;
  return f;
}
function setTab(name,fromHash){
  if(name!=='workday'&&name!=='maintenance')name='workday';
  current=name;
  $('tab-workday').setAttribute('aria-pressed',name==='workday'?'true':'false');
  $('tab-maintenance').setAttribute('aria-pressed',name==='maintenance'?'true':'false');
  $('pane-workday').hidden=name!=='workday';
  $('pane-maintenance').hidden=name!=='maintenance';
  ensureFrame(name);
  if(!fromHash&&location.hash!=='#'+name){try{history.replaceState(null,'','#'+name)}catch(e){}}
  loadBadge();
}
$('tab-workday').addEventListener('click',function(){setTab('workday')});
$('tab-maintenance').addEventListener('click',function(){setTab('maintenance')});
$('refresh').addEventListener('click',function(){
  var f=frames[current];
  if(f&&f.contentWindow){try{f.contentWindow.location.reload()}catch(e){}}
  loadBadge();
});
window.addEventListener('hashchange',function(){
  var h=location.hash.replace('#','');
  if(h==='workday'||h==='maintenance')setTab(h,true);
});
if(!isHA()){
  $('hint').hidden=false;
  $('hint').textContent='预览模式 · 部署到 HA 同源目录后打开';
  $('refresh').disabled=true;
}
var hash=location.hash.replace('#','');
var initial=(hash==='workday'||hash==='maintenance')?hash:'workday';
setTab(initial,hash==='workday'||hash==='maintenance');
setInterval(function(){if(document.visibilityState==='visible')loadBadge()},REFRESH_MS);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')loadBadge()});
})();
</script>
</body>
</html>
