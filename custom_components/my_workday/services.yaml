      selector:
        text:

delete_project:
  name: 删除维护项目
  description: 连同小项与历史一起删除，不可撤销。
  fields:
    slug:
      name: slug
      description: 英文标识
      selector:
        text:

list_projects:
  name: 列出维护项目
  description: 返回全部项目及到期汇总。

set_counter:
