get_snapshot:
  name: 读取全部数据
  description: 一次返回工作日、待办、维护项目的完整快照，供两个网页使用。

set_day:
  name: 改某一天
  description: 把某一天设为上班、休息，或恢复按国家安排。
  fields:
    date:
      name: date
      description: 日期，如 2026-11-28
      selector:
        text:
    mode:
      name: mode
      description: work / rest / auto
      selector:
        text:

set_custom:
  name: 批量设置工作日
  description: 一次替换自定义上班日与休息日清单。
  fields:
    work:
      name: work
      description: 逗号分隔的上班日
      selector:
        text:
    rest:
      name: rest
      description: 逗号分隔的休息日
      selector:
        text:

clear_custom:
  name: 清空自定义
  description: 清空全部自定义上班日与休息日。

refresh_data:
  name: 刷新放假数据
  description: 清掉缓存并重新拉取当年与次年放假安排。

set_year_data:
  name: 手工覆盖整年
  description: 用文本覆盖某一年的放假与补班安排，留空恢复自动获取。
  fields:
    year:
      name: year
      description: 年份
      selector:
        text:
    data:
      name: data
      description: 年度安排文本
      selector:
        text:

set_todos:
  name: 设置待办
  description: 整批替换待办清单，每行「[x] 日期 内容」。
  fields:
    data:
      name: data
      description: 待办文本
      selector:
        text:

set_anniversaries:
  name: 设置纪念日
  description: 整批替换纪念日，每行「名称: 日期」。
  fields:
    data:
      name: data
      description: 纪念日文本
      selector:
        text:

add_project:
  name: 新建维护项目
  description: 创建一个维护项目，中文名需要同时提供英文标识。
  fields:
    name:
      name: name
      description: 项目名称
      selector:
        text:
    slug:
      name: slug
      description: 英文标识
      selector:
        text:
    type:
      name: type
      description: 预置类型
      selector:
        text:
    need_counter:
      name: need_counter
      description: 是否计数
      selector:
        text:
    counter_unit:
      name: counter_unit
      description: 计数单位
      selector:
        text:
    counter_label:
      name: counter_label
      description: 计数显示名
      selector:
        text:
    counter:
      name: counter
      description: 当前计数
      selector:
        text:

update_project:
  name: 修改维护项目
  description: 改名称、计数开关、单位与显示名。
  fields:
    slug:
      name: slug
      description: 英文标识
      selector:
        text:
    name:
