get_snapshot:
  name: "读取全部数据"
  description: "一次返回工作日、待办、维护项目的完整快照，供两个网页使用。"

set_day:
  name: "改某一天"
  description: "把某一天设为上班、休息，或恢复按国家安排。"
  fields:
    date:
      name: "date"
      description: "日期，如 2026-11-28"
    mode:
      name: "mode"
      description: "work / rest / auto"

set_custom:
  name: "批量设置工作日"
  description: "一次替换自定义上班日与休息日清单。"
  fields:
    work:
      name: "work"
      description: "逗号分隔的上班日"
    rest:
      name: "rest"
      description: "逗号分隔的休息日"

clear_custom:
  name: "清空自定义"
  description: "清空全部自定义上班日与休息日。"

refresh_data:
  name: "刷新放假数据"
  description: "清掉缓存并重新拉取当年与次年放假安排。"

set_year_data:
  name: "手工覆盖整年"
  description: "用文本覆盖某一年的放假与补班安排，留空恢复自动获取。"
  fields:
    year:
      name: "year"
      description: "年份"
    data:
      name: "data"
      description: "年度安排文本"

set_todos:
  name: "设置待办"
  description: "整批替换待办清单，每行「[x] 日期 内容」。"
  fields:
    data:
      name: "data"
      description: "待办文本"

set_anniversaries:
  name: "设置纪念日"
  description: "整批替换纪念日，每行「名称: 日期」。"
  fields:
    data:
      name: "data"
      description: "纪念日文本"

add_project:
  name: "新建维护项目"
  description: "创建一个维护项目，中文名需要同时提供英文标识。"
  fields:
    name:
      name: "name"
      description: "项目名称"
    slug:
      name: "slug"
      description: "英文标识"
    type:
      name: "type"
      description: "预置类型"
    need_counter:
      name: "need_counter"
      description: "是否计数"
    counter_unit:
      name: "counter_unit"
      description: "计数单位"
    counter_label:
      name: "counter_label"
      description: "计数显示名"
    counter:
      name: "counter"
      description: "当前计数"

import_projects:
  name: "导入项目与小项"
  description: "批量导入维护项目（可含小项与既有状态）。传 projects 数组，或直接粘一段 JSON（单个项目对象或数组都行），二者选一。"
  fields:
    json:
      name: "json"
      description: "整段 JSON 字符串，与 projects 二选一"
      selector:
        text:
          multiline: true
    projects:
      name: "projects"
      description: "项目数组，与 json 二选一"
      selector:
        object: {}

update_project:
  name: "修改维护项目"
  description: "改名称、计数开关、单位与显示名。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    name:
      name: "name"
      description: "项目名称"
    need_counter:
      name: "need_counter"
      description: "是否计数"
    counter_unit:
      name: "counter_unit"
      description: "计数单位"
    counter_label:
      name: "counter_label"
      description: "计数显示名"

delete_project:
  name: "删除维护项目"
  description: "连同小项与历史一起删除，不可撤销。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"

list_projects:
  name: "列出维护项目"
  description: "返回全部项目及到期汇总。"

set_counter:
  name: "更新当前计数"
  description: "设置某个项目当前的里程 / 次数 / 小时数。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    value:
      name: "value"
      description: "当前数值"

add_item:
  name: "新增维护小项"
  description: "给项目加一件要做的事。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    name:
      name: "name"
      description: "维护内容"
    interval_days:
      name: "interval_days"
      description: "间隔天数"
    interval_counter:
      name: "interval_counter"
      description: "间隔计数"
    note:
      name: "note"
      description: "备注"

update_item:
  name: "修改维护小项"
  description: "改小项名称、周期与备注。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    item_id:
      name: "item_id"
      description: "小项 ID"
    name:
      name: "name"
      description: "维护内容"
    interval_days:
      name: "interval_days"
      description: "间隔天数"
    interval_counter:
      name: "interval_counter"
      description: "间隔计数"
    note:
      name: "note"
      description: "备注"

delete_item:
  name: "删除维护小项"
  description: "删掉一个小项。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    item_id:
      name: "item_id"
      description: "小项 ID"

set_baseline:
  name: "改上次维护基准"
  description: "初次使用时填上次实际维护日期与计数，不产生历史记录。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    item_id:
      name: "item_id"
      description: "小项 ID"
    last_date:
      name: "last_date"
      description: "上次日期"
    last_counter:
      name: "last_counter"
      description: "上次计数"

log_service:
  name: "记录一次维护"
  description: "一次可勾选多个小项，写入历史并更新基准。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    item_ids:
      name: "item_ids"
      description: "小项 ID 列表"
    date:
      name: "date"
      description: "维护日期"
    counter:
      name: "counter"
      description: "当前计数"
    note:
      name: "note"
      description: "统一备注"
    item_notes:
      name: "item_notes"
      description: "逐项备注"

update_record:
  name: "修改一条记录"
  description: "改历史记录里指定小项的那一份。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    record_id:
      name: "record_id"
      description: "记录 ID"
    item_id:
      name: "item_id"
      description: "小项 ID"
    date:
      name: "date"
      description: "日期"
    counter:
      name: "counter"
      description: "计数"
    note:
      name: "note"
      description: "备注"

delete_record:
  name: "删除一条记录"
  description: "从历史记录里删掉指定小项。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"
    record_id:
      name: "record_id"
      description: "记录 ID"
    item_id:
      name: "item_id"
      description: "小项 ID"

export_markdown:
  name: "导出 Markdown"
  description: "把一个项目导出为 Markdown 文本。"
  fields:
    slug:
      name: "slug"
      description: "英文标识"

sync_maintenance_todos:
  name: "同步维护到期为待办"
  description: "把已到期与快到期的维护项写成 [维护] 前缀的待办，重复调用会先清掉旧的同步项。"

export_all:
  name: "导出全部数据"
  description: "导出全部项目（含所有小项与完整维护记录）为 JSON，格式与 import_projects 导入相同，可直接用于备份/恢复。"

get_settings:
  name: 读取提醒设置
  description: 返回魔法推送配置、纪念日与维护提醒规则（含已推送记录）。

set_settings:
  name: 保存提醒设置
  description: 保存魔法推送地址/令牌与提醒规则。字段按需传入，未传的保持不变。
  fields:
    magicpush:
      name: 魔法推送配置
      description: 对象：url、token、enabled
      example: '{url:https://push.example.com,token:xxx,enabled:true}'
    anniversary:
      name: 纪念日提醒
      description: 对象：enabled、advance_days（天数数组）、time（HH:MM）
      example: '{enabled:true,advance_days:[7,3,1],time:08:00}'
    maintenance:
      name: 维护提醒
      description: 对象：enabled、weekday（0=周一..6=周日）、time（HH:MM）
      example: '{enabled:true,weekday:6,time:09:00}'

test_push:
  name: "测试魔法推送"
  description: "用传入的地址和 token 立即发一条测试消息，不写入设置。"
  fields:
    url:
      name: "服务地址"
      description: "magicpush 服务根地址，如 http://192.168.2.2:2818"
      example: "http://192.168.2.2:2818"
    token:
      name: "接口 Token"
      description: "magicpush 推送接口 token"
      example: "abc123"
